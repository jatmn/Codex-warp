# Default OpenAI-compatible baseline config.
# This file is loaded first; every --config file is merged on top of it.
# Override the target quickly with:
#   codex-warp --destination https://provider.example/v1

listen = "127.0.0.1:8787"

[webui]
# Disabled by default. Uncomment to serve the management UI at /ui/.
# enabled = true
# Optional: when set, /api requires a bearer token read from this environment variable.
# auth_token_env = "CODEX_WARP_WEBUI_TOKEN"
# WARNING: permits unauthenticated remote management and credential-bearing proxy edits.
# Set this only when every remote client is trusted and the network is access-controlled.
# allow_unauthenticated_remote_access = false
# db_path = "codex-warp.db"

[continue_guard]
# Enabled by default: chat-completions providers often finish with plain
# assistant text like "Now let me check..." instead of the next tool call.
# Warp detects that shape and sends response.completed end_turn=false so
# Codex automatically samples a follow-up turn instead of waiting for the user.
# A fully completed update_plan suppresses the guard unless later tool work
# shows the plan is stale; sessions that never call update_plan are still
# covered.
enabled = true
mode = "end_turn_false"
max_followups = 1

[config]
# Current Codex custom-provider refresh merges remote `/models` rows into its
# bundled GPT catalog. Keep the bundled GPT rows hidden so Codex Warp's live
# gateway catalog is the picker surface.
hide_codex_builtin_models = true

# Optional provider profile files to load automatically after this baseline.
# Paths are relative to the config file that declares them.
# include = [
#   "configs/clinepass.toml",
#   "configs/hicap.toml",
#   "configs/moonshot-kimicode.toml",
#   "configs/opencode-go.toml",
#   "configs/xiaomi-token-plan.toml",
#   "configs/openai-compatible.toml",
#   "configs/openrouter.toml",
# ]
model_family_include = [
  "configs/model-families/deepseek.toml",
  "configs/model-families/minimax.toml",
  "configs/model-families/moonshot-ai.toml",
  "configs/model-families/qwen.toml",
  "configs/model-families/x-ai.toml",
  "configs/model-families/xiaomi.toml",
  "configs/model-families/z-ai.toml",
  "configs/model-families/hy3.toml",
]
tool_policy_include = [
  "configs/tool-policies/github.toml",
]

# For a manually configured third-party provider, copy or edit:
#   configs/openai-compatible.toml
#
# Auto-review model choices belong in model-family metadata. When a family target
# is unprefixed, Codex Warp resolves it to the matching model in the selected
# provider catalog so review turns stay on the same gateway.
# If a Codex client instead sends the literal `codex-auto-review` model, set a
# concrete, routable fallback here. Otherwise Warp uses the active model it
# observed for the matching session.
# auto_review_model = "provider-id/review-model"

[transform]
# open_ai_chat translates Codex /responses requests to /chat/completions.
# responses keeps /responses but still applies editable request/tool morphs.
backend = "open_ai_chat"

# This is the important fix point for errors like:
#   tool type 'custom' is not supported by this gateway phase.
unsupported_tool_types = ["custom"]

# drop: remove unsupported tools before forwarding.
# as_function: coerce unsupported tools into ordinary function tools with a string input.
# passthrough: leave them untouched.
unsupported_tool_strategy = "as_function"

drop_empty_tool_choice = true

# Chat request morphs translate Codex Responses fields into chat-completions provider fields.
# `drop` is reserved for fields that have no chat-completions equivalent.
[[transform.chat_request_morphs]]
from = "include"
kind = "drop"

[[transform.chat_request_morphs]]
from = "prompt_cache_key"
to = "prompt_cache_key"
kind = "copy"

[[transform.chat_request_morphs]]
from = "client_metadata"
kind = "drop"

[[transform.chat_request_morphs]]
from = "reasoning.effort"
to = "reasoning_effort"
kind = "rename"

[[transform.chat_request_morphs]]
from = "service_tier"
to = "service_tier"
kind = "copy"

[[transform.chat_request_morphs]]
from = "store"
to = "store"
kind = "copy"

[[transform.chat_request_morphs]]
from = "text.format"
to = "response_format"
kind = "text_format"

# Native Responses forwarding has no default request-field morphs. Add
# [[transform.responses_request_morphs]] entries only for provider-specific
# deviations from the Responses API shape.
