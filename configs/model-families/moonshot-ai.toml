# Moonshot AI Kimi model-family compatibility.
# Broad entries keep shared tool behavior. Exact/variant entries carry context,
# modality, tool, and thinking differences.

[model_families.kimi_k2]
priority = 0
patterns = [
  "kimi-k2*",
  "kimi_k2*",
  "moonshot/kimi-k2*",
  "moonshotai/kimi-k2*",
]

[model_families.kimi_k2.model_metadata]
shell_type = "shell_command"
apply_patch_tool_type = "freeform"

[model_families.kimi_k2.transform]
unsupported_tool_types = ["custom"]
unsupported_tool_strategy = "as_function"
drop_empty_tool_choice = true
force_parallel_tool_calls = false

[model_families.kimi_k2_instruct]
priority = 10
patterns = [
  "kimi-k2",
  "kimi_k2",
  "kimi-k2-instruct",
  "kimi-k2-0711",
  "moonshot/kimi-k2",
  "moonshotai/kimi-k2",
  "moonshot/kimi-k2-instruct",
  "moonshotai/kimi-k2-instruct",
]

[model_families.kimi_k2_instruct.model_metadata]
context_window = 128000
default_reasoning_level = "none"
supported_reasoning_levels = ["none"]
input_modalities = ["text"]
supports_parallel_tool_calls = false
auto_review_model_override = "kimi-k2"

[model_families.kimi_k2_0905]
priority = 10
patterns = [
  "kimi-k2-0905",
  "kimi_k2_0905",
  "moonshot/kimi-k2-0905",
  "moonshotai/kimi-k2-0905",
]

[model_families.kimi_k2_0905.model_metadata]
context_window = 256000
default_reasoning_level = "none"
supported_reasoning_levels = ["none"]
input_modalities = ["text"]
supports_parallel_tool_calls = false

[model_families.kimi_k2_5]
priority = 10
patterns = [
  "kimi-k2.5",
  "kimi_k2.5",
  "kimi-k2-5",
  "kimi_k2_5",
  "moonshot/kimi-k2.5",
  "moonshotai/kimi-k2.5",
]

[model_families.kimi_k2_5.model_metadata]
context_window = 220000
max_context_window = 262144
default_reasoning_level = "medium"
supported_reasoning_levels = ["none", "low", "medium", "high"]
input_modalities = ["text", "image", "video"]
supports_parallel_tool_calls = false
supports_search_tool = true
auto_review_model_override = "kimi-k2.5"

[model_families.kimi_k2_5.transform]
force_parallel_tool_calls = false

[[model_families.kimi_k2_5.transform.remove_chat_request_morphs]]
from = "reasoning.effort"
to = "reasoning_effort"
kind = "rename"

[[model_families.kimi_k2_5.transform.append_chat_request_morphs]]
from = "reasoning.effort"
to = "thinking.type"
kind = "thinking_type"

