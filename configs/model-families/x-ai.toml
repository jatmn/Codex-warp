# xAI Grok model-family compatibility.
# Broad entries keep shared tool behavior. Exact/variant entries carry context,
# modality, search, and reasoning differences.

[model_families.x_ai_grok]
priority = 0
patterns = [
  "grok*",
  "grok-*",
  "xai/grok*",
  "x-ai/grok*",
]

[model_families.x_ai_grok.model_metadata]
shell_type = "shell_command"
apply_patch_tool_type = "freeform"
web_search_tool_type = "text"

[model_families.x_ai_grok.transform]
unsupported_tool_types = ["custom"]
unsupported_tool_strategy = "as_function"
drop_empty_tool_choice = true

[model_families.x_ai_grok_4_3]
priority = 10
patterns = [
  "grok-4.3",
  "grok_4.3",
  "grok-4.3-latest",
  "xai/grok-4.3",
  "x-ai/grok-4.3",
]

[model_families.x_ai_grok_4_3.model_metadata]
context_window = 1000000
default_reasoning_level = "medium"
supported_reasoning_levels = ["low", "medium", "high"]
input_modalities = ["text", "image"]
supports_parallel_tool_calls = true
supports_search_tool = true

[model_families.x_ai_grok_4_3.transform]
force_parallel_tool_calls = false

[[model_families.x_ai_grok_4_3.transform.append_chat_request_morphs]]
from = "reasoning.effort"
to = "reasoning_effort"
kind = "rename"

[model_families.x_ai_grok_build_0_1]
priority = 10
patterns = [
  "grok-build-0.1",
  "grok_build_0.1",
  "xai/grok-build-0.1",
  "x-ai/grok-build-0.1",
]

[model_families.x_ai_grok_build_0_1.model_metadata]
context_window = 256000
default_reasoning_level = "medium"
supported_reasoning_levels = ["low", "medium", "high"]
input_modalities = ["text"]
supports_parallel_tool_calls = true
supports_search_tool = true

[model_families.x_ai_grok_build_0_1.transform]
force_parallel_tool_calls = false

[model_families.x_ai_grok_4_5]
priority = 10
patterns = [
  "grok-4.5",
  "grok_4.5",
  "grok4.5",
  "grok-4.5-latest",
  "xai/grok-4.5",
  "x-ai/grok-4.5",
]

[model_families.x_ai_grok_4_5.model_metadata]
context_window = 500000
default_reasoning_level = "high"
supported_reasoning_levels = ["low", "medium", "high"]
input_modalities = ["text", "image"]
supports_parallel_tool_calls = true
supports_search_tool = true

[model_families.x_ai_grok_4_5.transform]
force_parallel_tool_calls = false
reasoning_effort_none_value = "low"

[[model_families.x_ai_grok_4_5.transform.append_chat_request_morphs]]
from = "reasoning.effort"
to = "reasoning_effort"
kind = "rename"

[model_families.x_ai_grok_4_6]
priority = 10
patterns = [
  "grok-4.6",
  "grok_4.6",
  "grok4.6",
  "grok-4.6-latest",
  "xai/grok-4.6",
  "x-ai/grok-4.6",
]

[model_families.x_ai_grok_4_6.model_metadata]
context_window = 500000
default_reasoning_level = "high"
supported_reasoning_levels = ["low", "medium", "high", "xhigh"]
input_modalities = ["text", "image"]
supports_parallel_tool_calls = true
supports_search_tool = true
auto_review_model_override = "grok-4.6"

[model_families.x_ai_grok_4_6.transform]
reasoning_effort_none_value = "low"

[[model_families.x_ai_grok_4_6.transform.append_chat_request_morphs]]
from = "reasoning.effort"
to = "reasoning_effort"
kind = "rename"
