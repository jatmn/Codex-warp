# ClinePass provider profile.
# Docs: https://docs.cline.bot/getting-started/clinepass
#
# ClinePass exposes OpenAI-compatible chat completions, but the public docs list
# the supported models directly. Keep this local catalog updated from the docs
# instead of relying on an upstream /models endpoint.

[providers.cline_pass]
name = "ClinePass"
base_url = "https://api.cline.bot/api/v1"
api_key_env = "CLINEPASS_API_KEY"
auth_header = "authorization"
auth_scheme = "Bearer"
responses_path = "/responses"
chat_completions_path = "/chat/completions"
models_path = "/models"

[[providers.cline_pass.model_catalog]]
id = "cline-pass/glm-5.2"
display_name = "GLM-5.2"

