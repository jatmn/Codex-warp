[[tool_policy.rules]]
id = "github_auth_token"
tool_name = "shell_command"
match_kind = "github_auth_token"
shell = "any"
outcome = "deny"
reason = "github_token_disclosure"

[[tool_policy.rules]]
id = "compound_github_command"
tool_name = "shell_command"
match_kind = "command_prefix"
command_prefix = ["gh"]
shell = "complex"
outcome = "force_manual"
reason = "complex_shell"
justification = "GitHub access is needed for the requested Codex task. Do you want to allow this command?"

[[tool_policy.rules]]
id = "github_auth_login"
tool_name = "shell_command"
match_kind = "command_prefix"
command_prefix = ["gh", "auth", "login"]
shell = "simple"
outcome = "force_manual"
reason = "github_interactive_auth"
justification = "GitHub authentication needs user interaction. Do you want to allow this command? If it prints a browser/device code, check the pending command output while it is still running."

