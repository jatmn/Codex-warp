# OpenCode Go provider profile.
# Docs: https://opencode.ai/docs/go/
#
# OpenCode Go exposes a mixed catalog: some models use an OpenAI-compatible
# /chat/completions endpoint and others use Anthropic-compatible /messages.
# Codex Warp currently drives OpenAI-compatible chat completions, so this
# profile intentionally exposes only the Go models documented for
# /zen/go/v1/chat/completions.

[providers.opencode_go]
name = "OpenCode Go"
base_url = "https://opencode.ai/zen/go/v1"
api_key_env = "OPENCODE_GO_API_KEY"
auth_header = "authorization"
auth_scheme = "Bearer"
responses_path = "/responses"
chat_completions_path = "/chat/completions"
models_path = "/models"
model_catalog_only = true

[[providers.opencode_go.model_catalog]]
id = "opencode-go/glm-5.2"
upstream_id = "glm-5.2"
display_name = "GLM-5.2"

