name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-please
  queue: max

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      attestations: read
      contents: read
      pull-requests: read
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
      releasable: ${{ steps.release-trigger.outputs.releasable }}
      source_sha: ${{ steps.release-trigger.outputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          OFFICIAL_RELEASES_ENABLED: ${{ vars.OFFICIAL_RELEASES_ENABLED || 'false' }}
        shell: bash
        run: |
          [ "${{ github.ref }}" = refs/heads/main ] || { echo 'Release Please must run from main' >&2; exit 1; }
          policy_enabled="$(jq -r '.enabled' tools/release-automation-policy.json)"
          if [ "$OFFICIAL_RELEASES_ENABLED" != true ] || [ "$policy_enabled" != true ]; then
            echo 'ready=false' >>"$GITHUB_OUTPUT"
            echo 'Release Please mutation is disabled by reviewed policy.' >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          OFFICIAL_ALLOW_MISSING_LATEST_TAG=1 bash scripts/check-prior-official-releases.sh
          echo 'ready=true' >>"$GITHUB_OUTPUT"
      - name: Install pinned Node for release eligibility
        if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
      - name: Install locked release policy dependencies
        if: steps.gate.outputs.ready == 'true'
        working-directory: tools/release-please-policy
        run: npm ci --ignore-scripts --no-audit --no-fund
      - id: release-trigger
        name: Check release eligibility without changing release notes
        if: steps.gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          planned_main="$(git rev-parse HEAD)"
          node tools/release-please-policy/harness.mjs --release-trigger
          live_main="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          [ "$planned_main" = "$live_main" ] || { echo 'main changed during eligibility planning' >&2; exit 1; }
          echo "source_sha=$planned_main" >>"$GITHUB_OUTPUT"

  release-please:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release-automation
    permissions:
      actions: read
      attestations: read
      contents: read
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      releases_created: ${{ steps.release.outputs.releases_created }}
      version: ${{ steps.release.outputs.version }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
      html_url: ${{ steps.release.outputs.html_url }}
      upload_url: ${{ steps.release.outputs.upload_url }}
      pr: ${{ steps.release-pr.outputs.pr }}
      prs_created: ${{ steps.release-pr.outputs.prs_created }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Revalidate protected state before reading the App key
        env:
          GH_TOKEN: ${{ github.token }}
          ELIGIBILITY_SOURCE_SHA: ${{ needs.gate.outputs.source_sha }}
        run: |
          [ "${{ github.ref }}" = refs/heads/main ]
          git fetch --no-tags origin main
          live_main="$(git rev-parse origin/main)"
          [ "$live_main" = "$ELIGIBILITY_SOURCE_SHA" ] || { echo 'main changed after eligibility planning; rerun from main' >&2; exit 1; }
          git checkout --detach "$live_main"
          [ "$(git rev-parse HEAD)" = "$live_main" ]
          [ "${{ vars.OFFICIAL_RELEASES_ENABLED }}" = true ]
          [ "$(jq -r '.enabled' tools/release-automation-policy.json)" = true ]
          OFFICIAL_ALLOW_MISSING_LATEST_TAG=1 bash scripts/check-prior-official-releases.sh
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: Codex-warp
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-workflows: write
      - name: Revalidate prior official releases with draft-visible token
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OFFICIAL_ALLOW_MISSING_LATEST_TAG: '1'
        run: bash scripts/check-prior-official-releases.sh
      - id: missing-draft
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: bash scripts/create-missing-official-draft.sh
      - id: release
        if: steps.missing-draft.outputs.created != 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true
      - id: release-pr
        if: steps.missing-draft.outputs.created != 'true' && steps.release.outputs.releases_created != 'true' && needs.gate.outputs.releasable == 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
      - name: Validate and summarize result
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          MISSING_CREATED: ${{ steps.missing-draft.outputs.created }}
          MISSING_TAG: ${{ steps.missing-draft.outputs.tag }}
          MISSING_SHA: ${{ steps.missing-draft.outputs.sha }}
          MISSING_RELEASE_ID: ${{ steps.missing-draft.outputs.release_id }}
          RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
          RELEASES_CREATED: ${{ steps.release.outputs.releases_created }}
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag_name }}
          SHA: ${{ steps.release.outputs.sha }}
          URL: ${{ steps.release.outputs.html_url }}
          PRS_CREATED: ${{ steps.release-pr.outputs.prs_created }}
          PR: ${{ steps.release-pr.outputs.pr }}
        shell: bash
        run: |
          if [ "$MISSING_CREATED" = true ]; then
            [[ "$MISSING_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            [[ "$MISSING_SHA" =~ ^[0-9a-f]{40}$ ]]
            [[ "$MISSING_RELEASE_ID" =~ ^[1-9][0-9]*$ ]]
            [ -z "$RELEASE_CREATED" ] || [ "$RELEASE_CREATED" != true ]
            [ -z "$PRS_CREATED" ] || [ "$PRS_CREATED" != true ]
            git fetch --force --no-tags origin "refs/tags/${MISSING_TAG}:refs/tags/${MISSING_TAG}"
            [ "$(git rev-parse "${MISSING_TAG}^{}")" = "$MISSING_SHA" ]
            release="$(LOOKUP_OFFICIAL_DRAFT_ATTEMPTS=1 LOOKUP_OFFICIAL_DRAFT_SLEEP=0 \
              bash scripts/lookup-official-draft.sh "${{ github.repository }}" "$MISSING_TAG")"
            [ "$(jq -r '.id' <<<"$release")" = "$MISSING_RELEASE_ID" ]
            latest_published="$(gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name || true)"
            [ "$latest_published" != "$MISSING_TAG" ]
            {
              echo '## Release Please'
              echo "- Created missing draft $MISSING_TAG (id \`$MISSING_RELEASE_ID\`) at \`$MISSING_SHA\`."
              echo '- Skipped opening a newer version while that tag remains unpublished.'
            } >>"$GITHUB_STEP_SUMMARY"
          elif [ "$RELEASE_CREATED" = true ]; then
            [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            [ "$TAG" = "v$VERSION" ]
            [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
            {
              echo '## Release Please'
              echo "- Created draft [$TAG]($URL) at \`$SHA\`."
              echo '- Its immutable tag is the only normal trigger for the distribution workflow.'
            } >>"$GITHUB_STEP_SUMMARY"
          elif [ "$PRS_CREATED" = true ]; then
            printf '## Release Please\n- Updated release PR: `%s`\n' "$PR" >>"$GITHUB_STEP_SUMMARY"
          else
            printf '## Release Please\n- No releasable work.\n' >>"$GITHUB_STEP_SUMMARY"
          fi
          if [ "$MISSING_CREATED" = true ]; then
            :
          elif [ "$RELEASE_CREATED" = true ]; then
            [ "$RELEASES_CREATED" = true ]
          else
            [ "$RELEASES_CREATED" = false ]
          fi
