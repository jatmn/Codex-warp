name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  source:
    name: Source Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable as of 2026-06-30
        with:
          components: rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Format
        run: cargo fmt --check

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --locked

      - name: CLI Smoke
        run: |
          target/debug/codex-warp --version
          target/debug/codex-warp --help

      - name: Web UI JavaScript
        run: |
          node --check src/webui_static/theme-bootstrap.js
          node --check src/webui_static/chart-math.js
          node --check src/webui_static/footer-status.js
          node --check src/webui_static/app-main.js
          node scripts/webui_chart_harness.js

      - name: Diff Whitespace
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          else
            before="${{ github.event.before }}"
            if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ]; then
              git diff --check "$before..${{ github.sha }}"
            else
              git show --check --format= HEAD
            fi
          fi

      - name: Docs Whitespace
        run: |
          ! grep -RInE '[[:blank:]]$' README.md AGENTS.md docs
