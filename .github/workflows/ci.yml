name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  source:
    name: Source Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      attestations: read
      contents: read
      pull-requests: read
    outputs:
      full_ci: ${{ steps.scope.outputs.full_ci }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Pull Request Policy
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          policy_dir="$(mktemp -d)"
          trap 'rm -rf "$policy_dir"' EXIT
          mkdir -p "$policy_dir/scripts" "$policy_dir/tools"
          for path in \
            scripts/check-pr-title.sh \
            scripts/check-release-readiness.sh \
            tools/release-automation-policy.json; do
            if ! git show "$BASE_SHA:$path" >"$policy_dir/$path" 2>/dev/null; then
              cp "$path" "$policy_dir/$path"
            fi
          done
          bash "$policy_dir/scripts/check-pr-title.sh"
          RELEASE_AUTOMATION_POLICY="$policy_dir/tools/release-automation-policy.json" \
            bash "$policy_dir/scripts/check-release-readiness.sh"

      - name: Classify Changes
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          classifier="$(mktemp)"
          trap 'rm -f "$classifier"' EXIT
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ] && \
             git show "$BASE_SHA:scripts/ci-change-scope.sh" > "$classifier" 2>/dev/null; then
            if [ "$EVENT_NAME" = "pull_request" ]; then
              scope_output="$(bash "$classifier" "$BASE_SHA...$HEAD_SHA")"
            else
              scope_output="$(bash "$classifier" "$BASE_SHA..$HEAD_SHA")"
            fi
          elif [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            scope_output=$'full_ci=true\nsupply_chain=true'
          else
            scope_output=$'full_ci=true\nsupply_chain=true'
          fi
          mapfile -t scope_lines <<< "$scope_output"
          [ "${#scope_lines[@]}" -eq 2 ]
          case "${scope_lines[0]}" in full_ci=true | full_ci=false) ;; *) exit 1 ;; esac
          case "${scope_lines[1]}" in supply_chain=true | supply_chain=false) ;; *) exit 1 ;; esac
          printf '%s\n%s\n' "${scope_lines[0]}" "${scope_lines[1]}" >> "$GITHUB_OUTPUT"

      - name: Install Pinned Rust
        if: steps.scope.outputs.full_ci == 'true'
        run: |
          rustup show active-toolchain
          rustc -Vv
          cargo -V

      - name: Install Pinned Node
        if: steps.scope.outputs.full_ci == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: tools/release-please-policy/package-lock.json

      - name: Cache Cargo
        if: steps.scope.outputs.full_ci == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Lockfile
        if: steps.scope.outputs.full_ci == 'true'
        run: cargo update --workspace --locked

      - name: Spell Check
        uses: crate-ci/typos@d43b6c087ac471e2ea7b8af622ff15f05c0c365b # v1.50.1
        with:
          files: . .github/pull_request_template.md

      - name: Documentation Checks
        if: steps.scope.outputs.full_ci != 'true'
        run: DOCS_CHECKS_SKIP_TYPOS=1 bash scripts/docs-checks.sh

      - name: Change Scope Harness
        if: steps.scope.outputs.full_ci != 'true'
        run: bash scripts/ci-change-scope-harness.sh

      - name: Source Checks
        if: steps.scope.outputs.full_ci == 'true'
        run: SOURCE_CHECKS_SKIP_TYPOS=1 bash scripts/source-checks.sh

      - name: Test
        if: steps.scope.outputs.full_ci == 'true'
        run: cargo test --locked

      - name: Build
        if: steps.scope.outputs.full_ci == 'true'
        run: cargo build --locked

      - name: Docs
        if: steps.scope.outputs.full_ci == 'true'
        run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: CLI Smoke
        if: steps.scope.outputs.full_ci == 'true'
        run: |
          target/debug/codex-warp --version
          target/debug/codex-warp --help

      - name: Diff Whitespace
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          else
            before="${{ github.event.before }}"
            if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ]; then
              git diff --check "$before..${{ github.sha }}"
            else
              git show --check --format= HEAD
            fi
          fi

  windows:
    name: Windows
    needs: source
    if: ${{ !cancelled() && needs.source.result == 'success' && needs.source.outputs.full_ci == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Pinned Rust
        shell: bash
        run: |
          rustup show active-toolchain
          rustc -Vv
          cargo -V

      - name: Install NASM
        uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --locked

      - name: CLI Smoke
        shell: cmd
        run: target\debug\codex-warp.exe --version && target\debug\codex-warp.exe --help
