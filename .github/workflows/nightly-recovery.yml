name: Nightly Recovery

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable nightly tag
        required: true
        type: string
      expected_sha:
        description: Expected full 40-character peeled tag SHA
        required: true
        type: string
      release_id:
        description: Exact release ID, or absent for recover-orphan-tag
        required: true
        type: string
      operation:
        description: Recovery operation
        required: true
        type: choice
        options: [resume-draft, replace-unpublished-draft, recover-orphan-tag, repair-branch]
      origin_run_id:
        description: Originating failed transaction run ID (orphan only)
        required: false
        type: string
        default: ''
      origin_run_attempt:
        description: Originating failed transaction run attempt (orphan only)
        required: false
        type: string
        default: ''
      confirmation:
        description: Tag, or replace-unpublished-draft:<tag>:<release-id>
        required: true
        type: string

concurrency:
  group: nightly-release
  queue: max

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      attestations: read
      contents: read
    outputs:
      build: ${{ steps.plan.outputs.build }}
      repair: ${{ steps.plan.outputs.repair }}
      origin: ${{ steps.plan.outputs.origin }}
      release_id: ${{ steps.plan.outputs.release_id }}
      date: ${{ steps.plan.outputs.date }}
      version: ${{ steps.plan.outputs.version }}
      origin_manifest_sha256: ${{ steps.plan.outputs.origin_manifest_sha256 }}
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
      SOURCE_SHA: ${{ inputs.expected_sha }}
      RELEASE_INPUT: ${{ inputs.release_id }}
      OPERATION: ${{ inputs.operation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: 24.20.0, cache: npm, cache-dependency-path: tools/release-please-policy/package-lock.json}
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: tools/release-please-policy
      - id: plan
        shell: bash
        run: |
          [ "${{ github.ref }}" = refs/heads/main ]
          [[ "$TAG" =~ ^nightly-([0-9]{8})-([0-9a-f]{12})$ ]]
          date="${BASH_REMATCH[1]}"; short="${BASH_REMATCH[2]}"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; [ "${SOURCE_SHA:0:12}" = "$short" ]
          git fetch --no-tags origin main
          git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
          git fetch origin '+refs/heads/nightly:refs/remotes/origin/nightly' 2>/dev/null || true
          [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          [ "$(git rev-parse "refs/tags/$TAG^{}")" = "$SOURCE_SHA" ]
          base="$(git show "$SOURCE_SHA:Cargo.toml" | sed -n 's/^version = "\([^"]*\)"/\1/p' | head -1)"
          [[ "$base" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="$base-nightly.$date.$short"
          release=''; release_id=''
          if release="$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" 2>/dev/null)"; then release_id="$(jq -r '.id' <<<"$release")"; fi
          build=true; repair=false; origin=false; origin_manifest=''
          case "$OPERATION" in
            resume-draft)
              [[ "$RELEASE_INPUT" =~ ^[1-9][0-9]*$ ]]; [ "$release_id" = "$RELEASE_INPUT" ]
              jq -e '.draft == true and .published_at == null and .prerelease == true' <<<"$release" >/dev/null
              [ "${{ inputs.confirmation }}" = "$TAG" ]; [ -z "${{ inputs.origin_run_id }}${{ inputs.origin_run_attempt }}" ] ;;
            replace-unpublished-draft)
              [[ "$RELEASE_INPUT" =~ ^[1-9][0-9]*$ ]]; [ "$release_id" = "$RELEASE_INPUT" ]
              jq -e '.draft == true and .published_at == null and .prerelease == true' <<<"$release" >/dev/null
              [ "${{ inputs.confirmation }}" = "replace-unpublished-draft:$TAG:$RELEASE_INPUT" ]; [ -z "${{ inputs.origin_run_id }}${{ inputs.origin_run_attempt }}" ] ;;
            recover-orphan-tag)
              [ "$RELEASE_INPUT" = absent ]; [ -z "$release_id" ]
              [[ "${{ inputs.origin_run_id }}" =~ ^[1-9][0-9]*$ ]]; [[ "${{ inputs.origin_run_attempt }}" =~ ^[1-9][0-9]*$ ]]
              [ "${{ inputs.confirmation }}" = "$TAG" ]
              run="$(gh api "repos/${{ github.repository }}/actions/runs/${{ inputs.origin_run_id }}/attempts/${{ inputs.origin_run_attempt }}")"
              jq -e '.name == "Nightly" or .name == "Nightly Recovery"' <<<"$run" >/dev/null
              mkdir origin-evidence
              if [ "$(jq -r '.name' <<<"$run")" = Nightly ]; then
                gh run download "${{ inputs.origin_run_id }}" --repo "${{ github.repository }}" --name nightly-publication-intent --dir origin-evidence
                gh run download "${{ inputs.origin_run_id }}" --repo "${{ github.repository }}" --name nightly-tag-creation-receipt --dir origin-evidence
                intent=nightly-intent.json; receipt=nightly-tag-receipt.json
              else
                gh run download "${{ inputs.origin_run_id }}" --repo "${{ github.repository }}" --name nightly-orphan-recovery-intent --dir origin-evidence
                gh run download "${{ inputs.origin_run_id }}" --repo "${{ github.repository }}" --name nightly-deletion-receipt --dir origin-evidence
                intent=nightly-orphan-recovery-intent.json; receipt=nightly-deletion-receipt.json
              fi
              gh attestation verify "origin-evidence/$intent" --repo "${{ github.repository }}"
              gh attestation verify "origin-evidence/$receipt" --repo "${{ github.repository }}"
              jq -e --arg tag "$TAG" --arg sha "$SOURCE_SHA" '.tag == $tag and .sourceSha == $sha' "origin-evidence/$intent" >/dev/null
              jq -e --arg tag "$TAG" --arg sha "$SOURCE_SHA" --argjson run "${{ inputs.origin_run_id }}" --argjson attempt "${{ inputs.origin_run_attempt }}" '.tag == $tag and ((.peeledSha == $sha) or (.sourceSha == $sha)) and .runId == $run and .runAttempt == $attempt' "origin-evidence/$receipt" >/dev/null
              [ "$(jq -r '.intentSha256' "origin-evidence/$receipt")" = "$(bash scripts/sha256-file.sh "origin-evidence/$intent")" ]
              origin_manifest="$(jq -r '.manifestSha256' "origin-evidence/$intent")"; [[ "$origin_manifest" =~ ^[0-9a-f]{64}$ ]]
              build=false; origin=true ;;
            repair-branch)
              [[ "$RELEASE_INPUT" =~ ^[1-9][0-9]*$ ]]; [ "$release_id" = "$RELEASE_INPUT" ]
              jq -e '.draft == false and .published_at != null and .prerelease == true' <<<"$release" >/dev/null
              [ "${{ inputs.confirmation }}" = "$TAG" ]; [ -z "${{ inputs.origin_run_id }}${{ inputs.origin_run_attempt }}" ]
              build=false; repair=true ;;
          esac
          branch="$(git rev-parse refs/remotes/origin/nightly 2>/dev/null || true)"
          if [ -n "$branch" ]; then git merge-base --is-ancestor "$branch" "$SOURCE_SHA"; fi
          recipe="tools/recovery-recipes/nightly-$TAG.json"; recipe_sha=null
          if [ -f "$recipe" ]; then
            node tools/release-please-policy/validate-json.mjs tools/recovery-recipes/schema.json "$recipe"
            jq -e --arg tag "$TAG" --arg sha "$SOURCE_SHA" '.kind == "nightly" and .tag == $tag and .expectedSourceSha == $sha' "$recipe" >/dev/null
            jq -e '.original == .replacement' "$recipe" >/dev/null || { echo 'This tag-specific replacement recipe also requires a reviewed workflow implementation for its declared substitutions.' >&2; exit 1; }
            recipe_sha="\"$(bash scripts/sha256-file.sh "$recipe")\""
          fi
          jq -n --arg operation "$OPERATION" --arg tag "$TAG" --arg source "$SOURCE_SHA" --arg date "$date" --arg version "$version" --arg release "$release_id" --arg branch "$branch" --arg control "${{ github.workflow_sha }}" --argjson recipe "$recipe_sha" '{schemaVersion:1,operation:$operation,tag:$tag,sourceSha:$source,date:$date,version:$version,releaseId:(if ($release|length)>0 then ($release|tonumber) else null end),branchSha:(if ($branch|length)>0 then $branch else null end),controlWorkflowSha:$control,recipeSha256:$recipe}' >nightly-recovery-plan.json
          echo "build=$build" >>"$GITHUB_OUTPUT"; echo "repair=$repair" >>"$GITHUB_OUTPUT"
          echo "origin=$origin" >>"$GITHUB_OUTPUT"
          echo "release_id=$release_id" >>"$GITHUB_OUTPUT"; echo "date=$date" >>"$GITHUB_OUTPUT"; echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "origin_manifest_sha256=$origin_manifest" >>"$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: {name: nightly-recovery-plan, path: nightly-recovery-plan.json, retention-days: 90}

  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: x86_64-unknown-linux-gnu, runner: ubuntu-24.04, binary: target/x86_64-unknown-linux-gnu/release/codex-warp}
          - {target: aarch64-apple-darwin, runner: macos-15, binary: target/aarch64-apple-darwin/release/codex-warp}
          - {target: x86_64-apple-darwin, runner: macos-15-intel, binary: target/x86_64-apple-darwin/release/codex-warp}
          - {target: x86_64-pc-windows-msvc, runner: windows-2025, binary: target/x86_64-pc-windows-msvc/release/codex-warp.exe}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: '${{ inputs.expected_sha }}', fetch-depth: 0, persist-credentials: false}
      - name: Build and package frozen nightly identity
        shell: bash
        env:
          CODEX_WARP_BUILD_VERSION: ${{ needs.plan.outputs.version }}
          NIGHTLY_DATE: ${{ needs.plan.outputs.date }}
          NIGHTLY_SOURCE_SHA: ${{ inputs.expected_sha }}
          NIGHTLY_VERSION: ${{ needs.plan.outputs.version }}
          NIGHTLY_TAG: ${{ inputs.tag }}
          TARGET: ${{ matrix.target }}
          BINARY_PATH: ${{ matrix.binary }}
          OUTPUT_DIR: target/nightly
          RUNNER_LABEL: ${{ matrix.runner }}
          WORKFLOW_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          [ "$(git rev-parse HEAD)" = "$NIGHTLY_SOURCE_SHA" ]
          rustup target add "$TARGET"
          if [ "$TARGET" = x86_64-unknown-linux-gnu ]; then cargo test --locked; fi
          cargo build --release --locked --target "$TARGET"
          export RUNNER_IMAGE="${ImageOS:-${{ runner.os }}}/${ImageVersion:-unknown}"
          bash scripts/package-nightly.sh
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with: {subject-path: 'target/nightly/codex-warp-${{ inputs.tag }}-${{ matrix.target }}.*'}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: {name: 'nightly-recovery-build-${{ matrix.target }}', path: target/nightly/, if-no-files-found: error}

  collect:
    needs: [plan, build]
    if: needs.plan.outputs.build == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: '${{ inputs.expected_sha }}', persist-credentials: false}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: 24.20.0, cache: npm, cache-dependency-path: tools/release-please-policy/package-lock.json}
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: tools/release-please-policy
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {pattern: nightly-recovery-build-*, path: candidate, merge-multiple: true}
      - name: Assemble exact nightly manifest
        run: |
          mapfile -t evidence < <(find candidate -maxdepth 1 -name '*-nightly-evidence.json' -print | sort); [ "${#evidence[@]}" -eq 4 ]
          jq -s '.[0] as $f|if all(.[];.repository==$f.repository and .tag==$f.tag and .date==$f.date and .sourceSha==$f.sourceSha and .baseVersion==$f.baseVersion and .version==$f.version and .cargoLockSha256==$f.cargoLockSha256 and .rustToolchainSha256==$f.rustToolchainSha256 and .packagingContractSha256==$f.packagingContractSha256 and .packagingScriptSha256==$f.packagingScriptSha256) then {"$schema":"./nightly-manifest.schema.json",schemaVersion:1,fileName:"codex-warp-nightly-manifest.json",repository:$f.repository,tag:$f.tag,date:$f.date,sourceSha:$f.sourceSha,baseVersion:$f.baseVersion,version:$f.version,workflow:$f.workflow,workflowSha:$f.workflowSha,cargoLockSha256:$f.cargoLockSha256,rustToolchainSha256:$f.rustToolchainSha256,packagingContractSha256:$f.packagingContractSha256,packagingScriptSha256:$f.packagingScriptSha256,artifacts:(map(.artifact)|sort_by(.target))} else error("nightly recovery evidence mismatch") end' "${evidence[@]}" >candidate/codex-warp-nightly-manifest.json
          jq -r '.artifacts[]|[.archiveSha256,.archive]|@tsv' candidate/codex-warp-nightly-manifest.json | sed $'s/\t/  /' >candidate/sha256.sum
          rm "${evidence[@]}"
          bash scripts/check-nightly-assets.sh candidate candidate/codex-warp-nightly-manifest.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: {name: nightly-recovery-candidate, path: candidate/, if-no-files-found: error}

  load-origin:
    needs: plan
    if: needs.plan.outputs.origin == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      attestations: read
      contents: read
    env: {GH_TOKEN: '${{ github.token }}'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: '${{ inputs.expected_sha }}', fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: 24.20.0, cache: npm, cache-dependency-path: tools/release-please-policy/package-lock.json}
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: tools/release-please-policy
      - name: Retrieve the exact candidate bound by orphan evidence
        run: |
          run="$(gh api "repos/${{ github.repository }}/actions/runs/${{ inputs.origin_run_id }}/attempts/${{ inputs.origin_run_attempt }}")"
          name=nightly-release-candidate; [ "$(jq -r '.name' <<<"$run")" != 'Nightly Recovery' ] || name=nightly-recovery-candidate
          gh run download "${{ inputs.origin_run_id }}" --repo "${{ github.repository }}" --name "$name" --dir candidate
          [ "$(bash scripts/sha256-file.sh candidate/codex-warp-nightly-manifest.json)" = "${{ needs.plan.outputs.origin_manifest_sha256 }}" ]
          bash scripts/check-nightly-assets.sh candidate candidate/codex-warp-nightly-manifest.json
          jq -e --arg tag "${{ inputs.tag }}" --arg sha "${{ inputs.expected_sha }}" '.tag==$tag and .sourceSha==$sha' candidate/codex-warp-nightly-manifest.json >/dev/null
          for archive in candidate/*.tar.xz candidate/*.zip; do gh attestation verify "$archive" --repo "${{ github.repository }}"; done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: {name: nightly-recovery-candidate, path: candidate/, if-no-files-found: error}

  mutate-release:
    needs: [plan, collect, load-origin]
    if: always() && needs.plan.result == 'success' && (needs.collect.result == 'success' || needs.load-origin.result == 'success') && vars.NIGHTLY_RECOVERY_READY == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release-automation
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
      SOURCE_SHA: ${{ inputs.expected_sha }}
      OPERATION: ${{ inputs.operation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: '${{ inputs.expected_sha }}', fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: 24.20.0, cache: npm, cache-dependency-path: tools/release-please-policy/package-lock.json}
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: tools/release-please-policy
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: nightly-recovery-candidate, path: candidate}
      - id: state
        name: Revalidate and retain mutation intent before private key use
        run: |
          [ "$(git rev-parse "refs/tags/$TAG^{}")" = "$SOURCE_SHA" ]
          bash scripts/check-nightly-assets.sh candidate candidate/codex-warp-nightly-manifest.json
          release=''; release_id=null
          if release="$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" 2>/dev/null)"; then release_id="$(jq '.id' <<<"$release")"; fi
          case "$OPERATION" in
            resume-draft) [ "$release_id" = "${{ inputs.release_id }}" ]; jq -e '.draft==true and .published_at==null' <<<"$release" >/dev/null ;;
            replace-unpublished-draft) [ "$release_id" = "${{ inputs.release_id }}" ]; jq -e '.draft==true and .published_at==null' <<<"$release" >/dev/null ;;
            recover-orphan-tag) [ "$release_id" = null ] ;;
          esac
          if [ "$OPERATION" = recover-orphan-tag ]; then
            [ "$(bash scripts/sha256-file.sh candidate/codex-warp-nightly-manifest.json)" = "${{ needs.plan.outputs.origin_manifest_sha256 }}" ]
          fi
          jq -n --arg operation "$OPERATION" --arg tag "$TAG" --arg source "$SOURCE_SHA" --argjson release_id "$release_id" --arg manifest "$(bash scripts/sha256-file.sh candidate/codex-warp-nightly-manifest.json)" --arg workflow "${{ github.workflow_sha }}" --argjson run "${{ github.run_id }}" --argjson attempt "${{ github.run_attempt }}" '{schemaVersion:1,operation:$operation,tag:$tag,sourceSha:$source,releaseId:$release_id,manifestSha256:$manifest,controlWorkflowSha:$workflow,runId:$run,runAttempt:$attempt}' >nightly-orphan-recovery-intent.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: {name: nightly-orphan-recovery-intent, path: nightly-orphan-recovery-intent.json, retention-days: 90, if-no-files-found: error}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with: {subject-path: nightly-orphan-recovery-intent.json}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: nightly-orphan-recovery-intent, path: retained-intent}
      - run: |
          cmp nightly-orphan-recovery-intent.json retained-intent/nightly-orphan-recovery-intent.json
          gh attestation verify retained-intent/nightly-orphan-recovery-intent.json --repo "${{ github.repository }}"
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: Codex-warp
          permission-contents: write
          permission-workflows: write
      - name: Delete only the attested never-published draft
        if: inputs.operation == 'replace-unpublished-draft'
        env: {GH_TOKEN: '${{ steps.app-token.outputs.token }}'}
        run: |
          gh api --method DELETE "repos/${{ github.repository }}/releases/${{ inputs.release_id }}"
          if gh api "repos/${{ github.repository }}/releases/${{ inputs.release_id }}" >/dev/null 2>&1; then exit 1; fi
          jq -n --arg tag "$TAG" --arg source "$SOURCE_SHA" --arg intent "$(bash scripts/sha256-file.sh nightly-orphan-recovery-intent.json)" --argjson release_id "${{ inputs.release_id }}" --argjson run "${{ github.run_id }}" --argjson attempt "${{ github.run_attempt }}" '{schemaVersion:1,tag:$tag,sourceSha:$source,deletedReleaseId:$release_id,intentSha256:$intent,runId:$run,runAttempt:$attempt}' >nightly-deletion-receipt.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: inputs.operation == 'replace-unpublished-draft'
        with: {name: nightly-deletion-receipt, path: nightly-deletion-receipt.json, retention-days: 90, if-no-files-found: error}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: inputs.operation == 'replace-unpublished-draft'
        with: {subject-path: nightly-deletion-receipt.json}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: inputs.operation == 'replace-unpublished-draft'
        with: {name: nightly-deletion-receipt, path: retained-receipt}
      - name: Retrieve deletion receipt before recreation
        if: inputs.operation == 'replace-unpublished-draft'
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          cmp nightly-deletion-receipt.json retained-receipt/nightly-deletion-receipt.json
          gh attestation verify retained-receipt/nightly-deletion-receipt.json --repo "${{ github.repository }}"
      - id: draft
        name: Reuse or recreate the draft for the existing immutable tag
        env: {GH_TOKEN: '${{ steps.app-token.outputs.token }}'}
        run: |
          if [ "$OPERATION" = resume-draft ]; then
            id="${{ inputs.release_id }}"
          else
            body="$(printf '# Recovered unstable nightly\n\nSource: https://github.com/%s/commit/%s\nVersion: %s\n' "${{ github.repository }}" "$SOURCE_SHA" "${{ needs.plan.outputs.version }}")"
            release="$(gh api --method POST "repos/${{ github.repository }}/releases" -f tag_name="$TAG" -f name="$TAG" -F draft=true -F prerelease=true -f make_latest=false -F generate_release_notes=false -f body="$body")"
            id="$(jq -r '.id' <<<"$release")"
          fi
          echo "release_id=$id" >>"$GITHUB_OUTPUT"
      - name: Upload missing assets, verify, publish, and advance branch
        env: {GH_TOKEN: '${{ steps.app-token.outputs.token }}'}
        run: |
          id="${{ steps.draft.outputs.release_id }}"
          for file in candidate/*; do
            name="$(basename "$file")"
            count="$(gh api --paginate "repos/${{ github.repository }}/releases/$id/assets" | jq -s --arg name "$name" '[.[][]|select(.name==$name)]|length')"; [ "$count" -le 1 ]
            if [ "$count" -eq 1 ]; then
              asset_id="$(gh api --paginate "repos/${{ github.repository }}/releases/$id/assets" | jq -s --arg name "$name" '[.[][]|select(.name==$name)][0].id')"
              gh api -H 'Accept: application/octet-stream' "repos/${{ github.repository }}/releases/assets/$asset_id" >remote-one
              [ "$(bash scripts/sha256-file.sh remote-one)" = "$(bash scripts/sha256-file.sh "$file")" ]
            else gh release upload "$TAG" "$file"; fi
          done
          mkdir remote-final
          while IFS=$'\t' read -r asset_id name; do gh api -H 'Accept: application/octet-stream' "repos/${{ github.repository }}/releases/assets/$asset_id" >"remote-final/$name"; done < <(gh api --paginate "repos/${{ github.repository }}/releases/$id/assets" --jq '.[]|[.id,.name]|@tsv')
          bash scripts/check-nightly-assets.sh remote-final remote-final/codex-warp-nightly-manifest.json
          gh api --method PATCH "repos/${{ github.repository }}/releases/$id" -F draft=false -F prerelease=true -f make_latest=false >/dev/null
          branch="$(gh api "repos/${{ github.repository }}/git/ref/heads/nightly" --jq '.object.sha' 2>/dev/null || true)"
          if [ -z "$branch" ]; then gh api --method POST "repos/${{ github.repository }}/git/refs" -f ref=refs/heads/nightly -f sha="$SOURCE_SHA" >/dev/null
          elif [ "$branch" != "$SOURCE_SHA" ]; then git merge-base --is-ancestor "$branch" "$SOURCE_SHA"; gh api --method PATCH "repos/${{ github.repository }}/git/refs/heads/nightly" -f sha="$SOURCE_SHA" -F force=false >/dev/null; fi
          [ "$(gh api "repos/${{ github.repository }}/git/ref/heads/nightly" --jq '.object.sha')" = "$SOURCE_SHA" ]

  repair-branch:
    needs: plan
    if: needs.plan.outputs.repair == 'true' && vars.NIGHTLY_RECOVERY_READY == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release-automation
    permissions: {attestations: read, contents: read}
    env: {GH_TOKEN: '${{ github.token }}', TAG: '${{ inputs.tag }}', SOURCE_SHA: '${{ inputs.expected_sha }}'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: '${{ inputs.expected_sha }}', fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: 24.20.0, cache: npm, cache-dependency-path: tools/release-please-policy/package-lock.json}
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: tools/release-please-policy
      - name: Verify complete published release before private key use
        run: |
          temp="$(mktemp -d)"; gh release download "$TAG" --repo "${{ github.repository }}" --dir "$temp"
          bash scripts/check-nightly-assets.sh "$temp" "$temp/codex-warp-nightly-manifest.json"
          jq -e --arg tag "$TAG" --arg sha "$SOURCE_SHA" '.tag==$tag and .sourceSha==$sha' "$temp/codex-warp-nightly-manifest.json" >/dev/null
          for archive in "$temp"/*.tar.xz "$temp"/*.zip; do gh attestation verify "$archive" --repo "${{ github.repository }}"; done
          branch="$(git ls-remote origin refs/heads/nightly|awk '{print $1}')"; if [ -n "$branch" ]; then git merge-base --is-ancestor "$branch" "$SOURCE_SHA"; fi
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with: {client-id: '${{ vars.RELEASE_APP_CLIENT_ID }}', private-key: '${{ secrets.RELEASE_APP_PRIVATE_KEY }}', owner: '${{ github.repository_owner }}', repositories: Codex-warp, permission-contents: write, permission-workflows: write}
      - name: Create or fast-forward nightly branch only
        env: {GH_TOKEN: '${{ steps.app-token.outputs.token }}'}
        run: |
          branch="$(gh api "repos/${{ github.repository }}/git/ref/heads/nightly" --jq '.object.sha' 2>/dev/null || true)"
          if [ -z "$branch" ]; then gh api --method POST "repos/${{ github.repository }}/git/refs" -f ref=refs/heads/nightly -f sha="$SOURCE_SHA" >/dev/null
          else git merge-base --is-ancestor "$branch" "$SOURCE_SHA"; gh api --method PATCH "repos/${{ github.repository }}/git/refs/heads/nightly" -f sha="$SOURCE_SHA" -F force=false >/dev/null; fi
          [ "$(gh api "repos/${{ github.repository }}/git/ref/heads/nightly" --jq '.object.sha')" = "$SOURCE_SHA" ]
