name: Nightly Recovery

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable nightly tag
        required: true
        type: string
      expected_sha:
        description: Expected full 40-character peeled tag SHA
        required: true
        type: string
      release_id:
        description: Exact release ID, or absent for recover-orphan-tag
        required: true
        type: string
      operation:
        description: Recovery operation
        required: true
        type: choice
        options: [resume-draft, replace-unpublished-draft, recover-orphan-tag, repair-branch]
      origin_run_id:
        description: Originating failed transaction run ID (resume or orphan)
        required: false
        type: string
        default: ''
      origin_run_attempt:
        description: Originating failed transaction run attempt (resume or orphan)
        required: false
        type: string
        default: ''
      evidence_manifest_sha256:
        description: Exact originating nightly manifest SHA-256 (resume only)
        required: false
        type: string
        default: ''
      confirmation:
        description: Tag, or replace-unpublished-draft:<tag>:<release-id>
        required: true
        type: string

concurrency:
  group: nightly-release
  queue: max

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      attestations: read
      contents: read
    outputs:
      build: ${{ steps.plan.outputs.build }}
      repair: ${{ steps.plan.outputs.repair }}
      origin: ${{ steps.plan.outputs.origin }}
      release_id: ${{ steps.plan.outputs.release_id }}
      date: ${{ steps.plan.outputs.date }}
      version: ${{ steps.plan.outputs.version }}
      origin_manifest_sha256: ${{ steps.plan.outputs.origin_manifest_sha256 }}
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
      SOURCE_SHA: ${{ inputs.expected_sha }}
      RELEASE_INPUT: ${{ inputs.release_id }}
      OPERATION: ${{ inputs.operation }}
      CONFIRMATION: ${{ inputs.confirmation }}
      ORIGIN_RUN_ID: ${{ inputs.origin_run_id }}
      ORIGIN_RUN_ATTEMPT: ${{ inputs.origin_run_attempt }}
      EVIDENCE_MANIFEST_SHA256: ${{ inputs.evidence_manifest_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: '${{ github.workflow_sha }}', fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: 24.20.0, cache: npm, cache-dependency-path: tools/release-please-policy/package-lock.json}
      - run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
        working-directory: tools/release-please-policy
      - id: plan
        shell: bash
        run: |
          [ "${{ github.ref }}" = refs/heads/main ]
          [[ "$TAG" =~ ^nightly-([0-9]{8})-([0-9a-f]{12})$ ]]
          date="${BASH_REMATCH[1]}"; short="${BASH_REMATCH[2]}"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; [ "${SOURCE_SHA:0:12}" = "$short" ]
          git fetch --no-tags origin main
          remote_tags="$(git ls-remote --tags --refs origin 'refs/tags/nightly-*')" || { echo 'unable to enumerate nightly tags' >&2; exit 1; }
          found_tag=false
          while IFS=$'\t' read -r _object ref; do
            [ -z "$ref" ] && continue
            [[ "$ref" =~ ^refs/tags/nightly-[0-9]{8}-[0-9a-f]{12}$ ]] || { echo "malformed nightly tag: $ref" >&2; exit 1; }
            [ "$ref" != "refs/tags/$TAG" ] || found_tag=true
            git fetch --force origin "$ref:$ref"
          done <<<"$remote_tags"
          [ "$found_tag" = true ]
          remote_branch="$(git ls-remote --heads origin refs/heads/nightly)" || { echo 'unable to inspect nightly branch' >&2; exit 1; }
          if [ -n "$remote_branch" ]; then git fetch --force origin '+refs/heads/nightly:refs/remotes/origin/nightly'; fi
          [ "$(git rev-parse HEAD)" = "${{ github.workflow_sha }}" ]
          git merge-base --is-ancestor "${{ github.workflow_sha }}" origin/main
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          [ "$(git rev-parse "refs/tags/$TAG^{}")" = "$SOURCE_SHA" ]
          mapfile -t source_tags < <(git tag --list 'nightly-*' --points-at "$SOURCE_SHA")
          [ "${#source_tags[@]}" -eq 1 ]; [ "${source_tags[0]}" = "$TAG" ]
          base="$(git show "$SOURCE_SHA:Cargo.toml" | sed -n 's/^version = "\([^"]*\)"/\1/p' | head -1)"
          [[ "$base" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="$base-nightly.$date+$short"
          nightly_releases="$(gh api --paginate "repos/${{ github.repository }}/releases?per_page=100" --jq '[.[] | select(.tag_name | test("^nightly-[0-9]{8}-[0-9a-f]{12}$")) | {id,tag_name,draft,prerelease,published_at}]' | jq -sc 'add // []')"
          while IFS=$'\t' read -r id release_tag; do
            git show-ref --verify --quiet "refs/tags/$release_tag" || { echo "nightly release $id has no immutable tag" >&2; exit 1; }
          done < <(jq -r '.[] | [.id,.tag_name] | @tsv' <<<"$nightly_releases")
          release=''; release_id=''
          release_count="$(jq --arg tag "$TAG" '[.[] | select(.tag_name==$tag)] | length' <<<"$nightly_releases")"
          [ "$release_count" -le 1 ]
          if [ "$release_count" -eq 1 ]; then release="$(jq -c --arg tag "$TAG" '.[] | select(.tag_name==$tag)' <<<"$nightly_releases")"; release_id="$(jq -r '.id' <<<"$release")"; fi
          build=true; repair=false; origin=false; origin_manifest=''
          case "$OPERATION" in
            resume-draft)
              [[ "$RELEASE_INPUT" =~ ^[1-9][0-9]*$ ]]; [ "$release_id" = "$RELEASE_INPUT" ]
              jq -e '.draft == true and .published_at == null and .prerelease == true' <<<"$release" >/dev/null
              [ "$CONFIRMATION" = "$TAG" ]
              [[ "$ORIGIN_RUN_ID" =~ ^[1-9][0-9]*$ ]]; [[ "$ORIGIN_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
              [[ "$EVIDENCE_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
              run="$(gh api "repos/${{ github.repository }}/actions/runs/$ORIGIN_RUN_ID/attempts/$ORIGIN_RUN_ATTEMPT")"
              latest="$(gh api "repos/${{ github.repository }}/actions/runs/$ORIGIN_RUN_ID")"
              jq -e --argjson attempt "$ORIGIN_RUN_ATTEMPT" '.run_attempt==$attempt' <<<"$latest" >/dev/null
              jq -e --argjson attempt "$ORIGIN_RUN_ATTEMPT" '.name=="Nightly" and (.event=="schedule" or .event=="workflow_dispatch") and .head_branch=="main" and .run_attempt==$attempt and .status=="completed" and .conclusion!=null and .conclusion!="success"' <<<"$run" >/dev/null
              jobs="$(gh api --paginate "repos/${{ github.repository }}/actions/runs/$ORIGIN_RUN_ID/attempts/$ORIGIN_RUN_ATTEMPT/jobs?per_page=100" | jq -sc '[.[] | .jobs[] | .steps[]]')"
              [ "$(jq '[.[]|select(.name=="Create immutable nightly tag and receipt" and .conclusion=="success")]|length' <<<"$jobs")" -eq 1 ]
              [ "$(jq '[.[]|select(.name=="Create draft prerelease for existing tag" and .conclusion=="success")]|length' <<<"$jobs")" -eq 1 ]
              [ "$(jq '[.[]|select(.name=="Verify and publish exact prerelease" and .conclusion!="success")]|length' <<<"$jobs")" -eq 1 ]
              mkdir origin-evidence
              gh run download "$ORIGIN_RUN_ID" --repo "${{ github.repository }}" --name nightly-publication-intent --dir origin-evidence
              gh run download "$ORIGIN_RUN_ID" --repo "${{ github.repository }}" --name nightly-tag-creation-receipt --dir origin-evidence
              gh attestation verify origin-evidence/nightly-intent.json --repo "${{ github.repository }}"
              gh attestation verify origin-evidence/nightly-tag-receipt.json --repo "${{ github.repository }}"
              jq -e --arg tag "$TAG" --arg sha "$SOURCE_SHA" --arg manifest "$EVIDENCE_MANIFEST_SHA256" --argjson run "$ORIGIN_RUN_ID" --argjson attempt "$ORIGIN_RUN_ATTEMPT" '.tag==$tag and .sourceSha==$sha and .manifestSha256==$manifest and .runId==$run and .runAttempt==$attempt' origin-evidence/nightly-intent.json >/dev/null
              jq -e --arg tag "$TAG" --arg sha "$SOURCE_SHA" --argjson run "$ORIGIN_RUN_ID" --argjson attempt "$ORIGIN_RUN_ATTEMPT" '.tag==$tag and .peeledSha==$sha and .runId==$run and .runAttempt==$attempt' origin-evidence/nightly-tag-receipt.json >/dev/null
              [ "$(jq -r '.intentSha256' origin-evidence/nightly-tag-receipt.json)" = "$(bash scripts/sha256-file.sh origin-evidence/nightly-intent.json)" ]
              origin_manifest="$EVIDENCE_MANIFEST_SHA256"; build=false; origin=true ;;
            replace-unpublished-draft)
              [[ "$RELEASE_INPUT" =~ ^[1-9][0-9]*$ ]]; [ "$release_id" = "$RELEASE_INPUT" ]
              jq -e '.draft == true and .published_at == null and .prerelease == true' <<<"$release" >/dev/null
              [ "$CONFIRMATION" = "replace-unpublished-draft:$TAG:$RELEASE_INPUT" ]; [ -z "$ORIGIN_RUN_ID$ORIGIN_RUN_ATTEMPT$EVIDENCE_MANIFEST_SHA256" ] ;;
            recover-orphan-tag)
              [ "$RELEASE_INPUT" = absent ]; [ -z "$release_id" ]
              [[ "$ORIGIN_RUN_ID" =~ ^[1-9][0-9]*$ ]]; [[ "$ORIGIN_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
              [ -z "$EVIDENCE_MANIFEST_SHA256" ]
              [ "$CONFIRMATION" = "$TAG" ]
              run="$(gh api "repos/${{ github.repository }}/actions/runs/$ORIGIN_RUN_ID/attempts/$ORIGIN_RUN_ATTEMPT")"
              latest="$(gh api "repos/${{ github.repository }}/actions/runs/$ORIGIN_RUN_ID")"
              jq -e --argjson attempt "$ORIGIN_RUN_ATTEMPT" '.run_attempt==$attempt' <<<"$latest" >/dev/null
              jq -e --argjson attempt "$ORIGIN_RUN_ATTEMPT" '.run_attempt==$attempt and .status=="completed" and .conclusion!=null and .conclusion!="success" and .head_branch=="main" and ((.name=="Nightly" and (.event=="schedule" or .event=="workflow_dispatch")) or (.name=="Nightly Recovery" and .event=="workflow_dispatch"))' <<<"$run" >/dev/null
              jobs="$(gh api --paginate "repos/${{ github.repository }}/actions/runs/$ORIGIN_RUN_ID/attempts/$ORIGIN_RUN_ATTEMPT/jobs?per_page=100" | jq -sc '[.[] | .jobs[] | .steps[]]')"
              require_step() {
                local name="$1" expected="$2" count conclusion
                count="$(jq --arg name "$name" '[.[] | select(.name==$name)] | length' <<<"$jobs")"; [ "$count" -eq 1 ]
                conclusion="$(jq -r --arg name "$name" '.[] | select(.name==$name) | .conclusion' <<<"$jobs")"
                if [ "$expected" = success ]; then [ "$conclusion" = success ]; else [ "$conclusion" != success ]; fi
              }
              mkdir origin-evidence
              if [ "$(jq -r '.name' <<<"$run")" = Nightly ]; then
                require_step 'Create immutable nightly tag and receipt' success
                require_step 'Create draft prerelease for existing tag' not-success
                require_step 'Upload complete candidate' not-success
                require_step 'Verify and publish exact prerelease' not-success
                gh run download "$ORIGIN_RUN_ID" --repo "${{ github.repository }}" --name nightly-publication-intent --dir origin-evidence
                gh run download "$ORIGIN_RUN_ID" --repo "${{ github.repository }}" --name nightly-tag-creation-receipt --dir origin-evidence
                intent=nightly-intent.json; receipt=nightly-tag-receipt.json
              else
                require_step 'Delete only the attested never-published draft' success
                require_step 'Reuse or recreate the draft for the existing immutable tag' not-success
                require_step 'Upload missing assets, verify, publish, and advance branch' not-success
                gh run download "$ORIGIN_RUN_ID" --repo "${{ github.repository }}" --name nightly-orphan-recovery-intent --dir origin-evidence
                gh run download "$ORIGIN_RUN_ID" --repo "${{ github.repository }}" --name nightly-deletion-receipt --dir origin-evidence
                intent=nightly-orphan-recovery-intent.json; receipt=nightly-deletion-receipt.json
              fi
              gh attestation verify "origin-evidence/$intent" --repo "${{ github.repository }}"
              gh attestation verify "origin-evidence/$receipt" --repo "${{ github.repository }}"
              jq -e --arg tag "$TAG" --arg sha "$SOURCE_SHA" '.tag == $tag and .sourceSha == $sha' "origin-evidence/$intent" >/dev/null
              jq -e --arg tag "$TAG" --arg sha "$SOURCE_SHA" --argjson run "$ORIGIN_RUN_ID" --argjson attempt "$ORIGIN_RUN_ATTEMPT" '.tag == $tag and ((.peeledSha == $sha) or (.sourceSha == $sha)) and .runId == $run and .runAttempt == $attempt' "origin-evidence/$receipt" >/dev/null
              if [ "$(jq -r '.name' <<<"$run")" = 'Nightly Recovery' ]; then
                jq -e --slurpfile intent "origin-evidence/$intent" '.deletedReleaseId == $intent[0].releaseId and $intent[0].operation == "replace-unpublished-draft"' "origin-evidence/$receipt" >/dev/null
              fi
              [ "$(jq -r '.intentSha256' "origin-evidence/$receipt")" = "$(bash scripts/sha256-file.sh "origin-evidence/$intent")" ]
              origin_manifest="$(jq -r '.manifestSha256' "origin-evidence/$intent")"; [[ "$origin_manifest" =~ ^[0-9a-f]{64}$ ]]
              build=false; origin=true ;;
            repair-branch)
              [[ "$RELEASE_INPUT" =~ ^[1-9][0-9]*$ ]]; [ "$release_id" = "$RELEASE_INPUT" ]
              jq -e '.draft == false and .published_at != null and .prerelease == true' <<<"$release" >/dev/null
              [ "$CONFIRMATION" = "$TAG" ]; [ -z "$ORIGIN_RUN_ID$ORIGIN_RUN_ATTEMPT$EVIDENCE_MANIFEST_SHA256" ]
              build=false; repair=true ;;
          esac
          branch="$(git rev-parse refs/remotes/origin/nightly 2>/dev/null || true)"
          if [ -n "$branch" ]; then git merge-base --is-ancestor "$branch" "$SOURCE_SHA"; fi
          recipe="tools/recovery-recipes/nightly-$TAG.json"; recipe_sha=null
          if [ -f "$recipe" ]; then
            node tools/release-please-policy/validate-json.mjs tools/recovery-recipes/schema.json "$recipe"
            jq -e --arg tag "$TAG" --arg sha "$SOURCE_SHA" '.kind == "nightly" and .tag == $tag and .expectedSourceSha == $sha' "$recipe" >/dev/null
            jq -e '.original == .replacement' "$recipe" >/dev/null || { echo 'This tag-specific replacement recipe also requires a reviewed workflow implementation for its declared substitutions.' >&2; exit 1; }
            recipe_sha="\"$(bash scripts/sha256-file.sh "$recipe")\""
          fi
          jq -n --arg operation "$OPERATION" --arg tag "$TAG" --arg source "$SOURCE_SHA" --arg date "$date" --arg version "$version" --arg release "$release_id" --arg branch "$branch" --arg control "${{ github.workflow_sha }}" --arg origin_run "$ORIGIN_RUN_ID" --arg origin_attempt "$ORIGIN_RUN_ATTEMPT" --arg origin_manifest "$origin_manifest" --argjson recipe "$recipe_sha" '{schemaVersion:1,operation:$operation,tag:$tag,sourceSha:$source,date:$date,version:$version,releaseId:(if ($release|length)>0 then ($release|tonumber) else null end),branchSha:(if ($branch|length)>0 then $branch else null end),controlWorkflowSha:$control,recipeSha256:$recipe,originRunId:(if ($origin_run|length)>0 then ($origin_run|tonumber) else null end),originRunAttempt:(if ($origin_attempt|length)>0 then ($origin_attempt|tonumber) else null end),originManifestSha256:(if ($origin_manifest|length)>0 then $origin_manifest else null end)}' >nightly-recovery-plan.json
          echo "build=$build" >>"$GITHUB_OUTPUT"; echo "repair=$repair" >>"$GITHUB_OUTPUT"
          echo "origin=$origin" >>"$GITHUB_OUTPUT"
          echo "release_id=$release_id" >>"$GITHUB_OUTPUT"; echo "date=$date" >>"$GITHUB_OUTPUT"; echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "origin_manifest_sha256=$origin_manifest" >>"$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: {name: nightly-recovery-plan, path: nightly-recovery-plan.json, retention-days: 90}

  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: x86_64-unknown-linux-gnu, runner: ubuntu-24.04, binary: target/x86_64-unknown-linux-gnu/release/codex-warp}
          - {target: aarch64-apple-darwin, runner: macos-15, binary: target/aarch64-apple-darwin/release/codex-warp}
          - {target: x86_64-apple-darwin, runner: macos-15-intel, binary: target/x86_64-apple-darwin/release/codex-warp}
          - {target: x86_64-pc-windows-msvc, runner: windows-2025, binary: target/x86_64-pc-windows-msvc/release/codex-warp.exe}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: '${{ inputs.expected_sha }}', fetch-depth: 0, persist-credentials: false}
      - name: Build and package frozen nightly identity
        shell: bash
        env:
          CODEX_WARP_BUILD_VERSION: ${{ needs.plan.outputs.version }}
          NIGHTLY_DATE: ${{ needs.plan.outputs.date }}
          NIGHTLY_SOURCE_SHA: ${{ inputs.expected_sha }}
          NIGHTLY_VERSION: ${{ needs.plan.outputs.version }}
          NIGHTLY_TAG: ${{ inputs.tag }}
          TARGET: ${{ matrix.target }}
          BINARY_PATH: ${{ matrix.binary }}
          OUTPUT_DIR: target/nightly
          RUNNER_LABEL: ${{ matrix.runner }}
          WORKFLOW_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          [ "$(git rev-parse HEAD)" = "$NIGHTLY_SOURCE_SHA" ]
          rustup target add "$TARGET"
          if [ "$TARGET" = x86_64-unknown-linux-gnu ]; then cargo test --locked; fi
          cargo build --release --locked --target "$TARGET"
          export RUNNER_IMAGE="${ImageOS:-${{ runner.os }}}/${ImageVersion:-unknown}"
          bash scripts/package-nightly.sh
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with: {subject-path: 'target/nightly/codex-warp-${{ inputs.tag }}-${{ matrix.target }}.*'}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: {name: 'nightly-recovery-build-${{ matrix.target }}', path: target/nightly/, if-no-files-found: error}

  collect:
    needs: [plan, build]
    if: needs.plan.outputs.build == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: '${{ inputs.expected_sha }}', persist-credentials: false}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: 24.20.0, cache: npm, cache-dependency-path: tools/release-please-policy/package-lock.json}
      - run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
        working-directory: tools/release-please-policy
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {pattern: nightly-recovery-build-*, path: candidate, merge-multiple: true}
      - name: Assemble exact nightly manifest
        run: |
          mapfile -t evidence < <(find candidate -maxdepth 1 -name '*-nightly-evidence.json' -print | sort); [ "${#evidence[@]}" -eq 4 ]
          jq -s '.[0] as $f|if all(.[];.repository==$f.repository and .tag==$f.tag and .date==$f.date and .sourceSha==$f.sourceSha and .baseVersion==$f.baseVersion and .version==$f.version and .workflow==$f.workflow and .workflowSha==$f.workflowSha and .cargoLockSha256==$f.cargoLockSha256 and .rustToolchainSha256==$f.rustToolchainSha256 and .packagingContractSha256==$f.packagingContractSha256 and .packagingScriptSha256==$f.packagingScriptSha256) then {"$schema":"./nightly-manifest.schema.json",schemaVersion:1,fileName:"codex-warp-nightly-manifest.json",repository:$f.repository,tag:$f.tag,date:$f.date,sourceSha:$f.sourceSha,baseVersion:$f.baseVersion,version:$f.version,workflow:$f.workflow,workflowSha:$f.workflowSha,cargoLockSha256:$f.cargoLockSha256,rustToolchainSha256:$f.rustToolchainSha256,packagingContractSha256:$f.packagingContractSha256,packagingScriptSha256:$f.packagingScriptSha256,artifacts:(map(.artifact)|sort_by(.target))} else error("nightly recovery evidence mismatch") end' "${evidence[@]}" >candidate/codex-warp-nightly-manifest.json
          jq -r '.artifacts[]|[.archiveSha256,.archive]|@tsv' candidate/codex-warp-nightly-manifest.json | sed $'s/\t/  /' >candidate/sha256.sum
          rm "${evidence[@]}"
          bash scripts/check-nightly-assets.sh candidate candidate/codex-warp-nightly-manifest.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: {name: nightly-recovery-candidate, path: candidate/, if-no-files-found: error}

  load-origin:
    needs: plan
    if: needs.plan.outputs.origin == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      attestations: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
      SOURCE_SHA: ${{ inputs.expected_sha }}
      ORIGIN_RUN_ID: ${{ inputs.origin_run_id }}
      ORIGIN_RUN_ATTEMPT: ${{ inputs.origin_run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: '${{ github.workflow_sha }}', fetch-depth: 0, persist-credentials: false}
      - name: Materialize frozen nightly source separately from protected control code
        run: |
          git fetch --no-tags origin main
          git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
          [ "$(git rev-parse HEAD)" = "${{ github.workflow_sha }}" ]
          git merge-base --is-ancestor "${{ github.workflow_sha }}" origin/main
          [ "$(git rev-parse "refs/tags/$TAG^{}")" = "$SOURCE_SHA" ]
          git worktree add --quiet --detach release-source "$SOURCE_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: 24.20.0, cache: npm, cache-dependency-path: tools/release-please-policy/package-lock.json}
      - run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
        working-directory: tools/release-please-policy
      - name: Retrieve the exact candidate bound by orphan evidence
        env:
          ORIGIN_RUN_ID: ${{ inputs.origin_run_id }}
          ORIGIN_RUN_ATTEMPT: ${{ inputs.origin_run_attempt }}
          TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ inputs.expected_sha }}
        run: |
          run="$(gh api "repos/${{ github.repository }}/actions/runs/$ORIGIN_RUN_ID/attempts/$ORIGIN_RUN_ATTEMPT")"
          name=nightly-release-candidate; [ "$(jq -r '.name' <<<"$run")" != 'Nightly Recovery' ] || name=nightly-recovery-candidate
          gh run download "$ORIGIN_RUN_ID" --repo "${{ github.repository }}" --name "$name" --dir candidate
          [ "$(bash scripts/sha256-file.sh candidate/codex-warp-nightly-manifest.json)" = "${{ needs.plan.outputs.origin_manifest_sha256 }}" ]
          NIGHTLY_MANIFEST_SCHEMA_PATH="$PWD/release-source/tools/nightly-manifest.schema.json" bash scripts/check-nightly-assets.sh candidate candidate/codex-warp-nightly-manifest.json "$PWD/release-source"
          jq -e --arg tag "$TAG" --arg sha "$SOURCE_SHA" --arg workflow "https://github.com/${{ github.repository }}/actions/runs/$ORIGIN_RUN_ID" '.tag==$tag and .sourceSha==$sha and .workflow==$workflow' candidate/codex-warp-nightly-manifest.json >/dev/null
          for archive in candidate/*.tar.xz candidate/*.zip; do bash scripts/verify-nightly-attestation.sh "$archive" candidate/codex-warp-nightly-manifest.json; done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: {name: nightly-recovery-candidate, path: candidate/, if-no-files-found: error}

  mutate-release:
    needs: [plan, collect, load-origin]
    if: always() && needs.plan.result == 'success' && (needs.collect.result == 'success' || needs.load-origin.result == 'success') && vars.NIGHTLY_RECOVERY_READY == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release-automation
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
      SOURCE_SHA: ${{ inputs.expected_sha }}
      OPERATION: ${{ inputs.operation }}
      RELEASE_INPUT: ${{ inputs.release_id }}
      ORIGIN_RUN_ID: ${{ inputs.origin_run_id }}
      ORIGIN_RUN_ATTEMPT: ${{ inputs.origin_run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: '${{ github.workflow_sha }}', fetch-depth: 0, persist-credentials: false}
      - name: Materialize frozen nightly source separately from protected control code
        run: |
          git fetch --no-tags origin main
          git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
          [ "$(git rev-parse HEAD)" = "${{ github.workflow_sha }}" ]
          git merge-base --is-ancestor "${{ github.workflow_sha }}" origin/main
          [ "$(git rev-parse "refs/tags/$TAG^{}")" = "$SOURCE_SHA" ]
          git worktree add --quiet --detach release-source "$SOURCE_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: 24.20.0, cache: npm, cache-dependency-path: tools/release-please-policy/package-lock.json}
      - run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
        working-directory: tools/release-please-policy
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: nightly-recovery-candidate, path: candidate}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: nightly-recovery-plan, path: retained-plan}
      - id: state
        name: Revalidate and retain mutation intent before private key use
        run: |
          [ "$(git rev-parse "refs/tags/$TAG^{}")" = "$SOURCE_SHA" ]
          NIGHTLY_MANIFEST_SCHEMA_PATH="$PWD/release-source/tools/nightly-manifest.schema.json" bash scripts/check-nightly-assets.sh candidate candidate/codex-warp-nightly-manifest.json "$PWD/release-source"
          for archive in candidate/*.tar.xz candidate/*.zip; do bash scripts/verify-nightly-attestation.sh "$archive" candidate/codex-warp-nightly-manifest.json; done
          release=''; release_id=null; release_state=null; remote_assets='[]'
          live_releases="$(gh api --paginate "repos/${{ github.repository }}/releases?per_page=100" | jq -sc 'add // []')"
          live_count="$(jq --arg tag "$TAG" '[.[] | select(.tag_name==$tag)] | length' <<<"$live_releases")"; [ "$live_count" -le 1 ]
          if [ "$live_count" -eq 1 ]; then
            release="$(jq -c --arg tag "$TAG" '.[] | select(.tag_name==$tag)' <<<"$live_releases")"
            release_id="$(jq '.id' <<<"$release")"
            release_state="$(jq -c '{id,tagName:.tag_name,draft,prerelease,publishedAt:.published_at}' <<<"$release")"
            remote_assets="$(gh api --paginate "repos/${{ github.repository }}/releases/$release_id/assets" | jq -sc '[.[][] | {id,name,state}] | sort_by(.id)')"
            jq -e 'all(.[];.state=="uploaded" or .state=="starter") and (length==([.[].name]|unique|length))' <<<"$remote_assets" >/dev/null
          fi
          case "$OPERATION" in
            resume-draft) [ "$release_id" = "$RELEASE_INPUT" ]; jq -e --arg tag "$TAG" '.tag_name==$tag and .draft==true and .published_at==null and .prerelease==true' <<<"$release" >/dev/null ;;
            replace-unpublished-draft) [ "$release_id" = "$RELEASE_INPUT" ]; jq -e --arg tag "$TAG" '.tag_name==$tag and .draft==true and .published_at==null and .prerelease==true' <<<"$release" >/dev/null ;;
            recover-orphan-tag) [ "$release_id" = null ] ;;
          esac
          if [ "$OPERATION" = recover-orphan-tag ]; then
            [ "$(bash scripts/sha256-file.sh candidate/codex-warp-nightly-manifest.json)" = "${{ needs.plan.outputs.origin_manifest_sha256 }}" ]
          fi
          jq -e --arg operation "$OPERATION" --arg tag "$TAG" --arg source "$SOURCE_SHA" --arg workflow "${{ github.workflow_sha }}" --arg origin_run "$ORIGIN_RUN_ID" --arg origin_attempt "$ORIGIN_RUN_ATTEMPT" '.operation==$operation and .tag==$tag and .sourceSha==$source and .controlWorkflowSha==$workflow and .originRunId==(if ($origin_run|length)>0 then ($origin_run|tonumber) else null end) and .originRunAttempt==(if ($origin_attempt|length)>0 then ($origin_attempt|tonumber) else null end)' retained-plan/nightly-recovery-plan.json >/dev/null
          candidate_assets="$({ while IFS= read -r file; do jq -n --arg name "$(basename "$file")" --arg digest "$(bash scripts/sha256-file.sh "$file")" '{name:$name,sha256:$digest}'; done < <(find candidate -maxdepth 1 -type f -print | sort); } | jq -sc '.')"
          branch_sha="$(git ls-remote --heads origin refs/heads/nightly | awk '{print $1}')"
          jq -n --arg operation "$OPERATION" --arg tag "$TAG" --arg source "$SOURCE_SHA" --argjson release_id "$release_id" --argjson release_state "$release_state" --argjson remote_assets "$remote_assets" --argjson candidate_assets "$candidate_assets" --arg manifest "$(bash scripts/sha256-file.sh candidate/codex-warp-nightly-manifest.json)" --arg plan "$(bash scripts/sha256-file.sh retained-plan/nightly-recovery-plan.json)" --arg tag_sha "$(git rev-parse "refs/tags/$TAG^{}")" --arg branch "$branch_sha" --arg workflow "${{ github.workflow_sha }}" --arg origin_run "$ORIGIN_RUN_ID" --arg origin_attempt "$ORIGIN_RUN_ATTEMPT" --argjson run "${{ github.run_id }}" --argjson attempt "${{ github.run_attempt }}" '{schemaVersion:1,operation:$operation,tag:$tag,sourceSha:$source,releaseId:$release_id,releaseState:$release_state,remoteAssets:$remote_assets,candidateAssets:$candidate_assets,manifestSha256:$manifest,planSha256:$plan,tagSha:$tag_sha,branchSha:(if ($branch|length)>0 then $branch else null end),controlWorkflowSha:$workflow,originRunId:(if ($origin_run|length)>0 then ($origin_run|tonumber) else null end),originRunAttempt:(if ($origin_attempt|length)>0 then ($origin_attempt|tonumber) else null end),runId:$run,runAttempt:$attempt}' >nightly-orphan-recovery-intent.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: {name: nightly-orphan-recovery-intent, path: nightly-orphan-recovery-intent.json, retention-days: 90, if-no-files-found: error}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with: {subject-path: nightly-orphan-recovery-intent.json}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: nightly-orphan-recovery-intent, path: retained-intent}
      - run: |
          cmp nightly-orphan-recovery-intent.json retained-intent/nightly-orphan-recovery-intent.json
          gh attestation verify retained-intent/nightly-orphan-recovery-intent.json --repo "${{ github.repository }}"
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: Codex-warp
          permission-contents: write
          permission-workflows: write
      - name: Revalidate the exact attested state after credential issuance
        env: {GH_TOKEN: '${{ steps.app-token.outputs.token }}'}
        run: |
          [ "$(bash scripts/sha256-file.sh candidate/codex-warp-nightly-manifest.json)" = "$(jq -r '.manifestSha256' nightly-orphan-recovery-intent.json)" ]
          [ "$(bash scripts/sha256-file.sh retained-plan/nightly-recovery-plan.json)" = "$(jq -r '.planSha256' nightly-orphan-recovery-intent.json)" ]
          candidate_assets="$({ while IFS= read -r file; do jq -n --arg name "$(basename "$file")" --arg digest "$(bash scripts/sha256-file.sh "$file")" '{name:$name,sha256:$digest}'; done < <(find candidate -maxdepth 1 -type f -print | sort); } | jq -sc '.')"
          [ "$(jq -S . <<<"$candidate_assets")" = "$(jq -S '.candidateAssets' nightly-orphan-recovery-intent.json)" ]
          [ "$(gh api "repos/${{ github.repository }}/git/ref/tags/$TAG" --jq '.object.sha')" = "$(jq -r '.tagSha' nightly-orphan-recovery-intent.json)" ]
          branch_sha="$(git ls-remote --heads origin refs/heads/nightly | awk '{print $1}')"
          [ "${branch_sha:-null}" = "$(jq -r '.branchSha' nightly-orphan-recovery-intent.json)" ]
          expected_release="$(jq -c '.releaseState' nightly-orphan-recovery-intent.json)"
          if [ "$expected_release" = null ]; then
            live_releases="$(gh api --paginate "repos/${{ github.repository }}/releases?per_page=100" | jq -sc 'add // []')"
            [ "$(jq --arg tag "$TAG" '[.[] | select(.tag_name==$tag)] | length' <<<"$live_releases")" -eq 0 ]
          else
            live="$(gh api "repos/${{ github.repository }}/releases/$RELEASE_INPUT")"
            live_state="$(jq -c '{id,tagName:.tag_name,draft,prerelease,publishedAt:.published_at}' <<<"$live")"
            [ "$(jq -S . <<<"$live_state")" = "$(jq -S . <<<"$expected_release")" ]
            live_assets="$(gh api --paginate "repos/${{ github.repository }}/releases/$RELEASE_INPUT/assets" | jq -sc '[.[][] | {id,name,state}] | sort_by(.id)')"
            [ "$(jq -S . <<<"$live_assets")" = "$(jq -S '.remoteAssets' nightly-orphan-recovery-intent.json)" ]
          fi
      - name: Delete only the attested never-published draft
        if: inputs.operation == 'replace-unpublished-draft'
        env: {GH_TOKEN: '${{ steps.app-token.outputs.token }}'}
        run: |
          live="$(gh api "repos/${{ github.repository }}/releases/$RELEASE_INPUT")"
          live_state="$(jq -c '{id,tagName:.tag_name,draft,prerelease,publishedAt:.published_at}' <<<"$live")"
          [ "$(jq -S . <<<"$live_state")" = "$(jq -S '.releaseState' nightly-orphan-recovery-intent.json)" ]
          live_assets="$(gh api --paginate "repos/${{ github.repository }}/releases/$RELEASE_INPUT/assets" | jq -sc '[.[][] | {id,name,state}] | sort_by(.id)')"
          [ "$(jq -S . <<<"$live_assets")" = "$(jq -S '.remoteAssets' nightly-orphan-recovery-intent.json)" ]
          [ "$(gh api "repos/${{ github.repository }}/git/ref/tags/$TAG" --jq '.object.sha')" = "$SOURCE_SHA" ]
          gh api --method DELETE "repos/${{ github.repository }}/releases/$RELEASE_INPUT"
          live_releases="$(gh api --paginate "repos/${{ github.repository }}/releases?per_page=100" | jq -sc 'add // []')"
          [ "$(jq --arg tag "$TAG" --argjson id "$RELEASE_INPUT" '[.[] | select(.id==$id or .tag_name==$tag)] | length' <<<"$live_releases")" -eq 0 ]
          jq -n --arg tag "$TAG" --arg source "$SOURCE_SHA" --arg intent "$(bash scripts/sha256-file.sh nightly-orphan-recovery-intent.json)" --argjson release_id "$RELEASE_INPUT" --argjson run "${{ github.run_id }}" --argjson attempt "${{ github.run_attempt }}" '{schemaVersion:1,tag:$tag,sourceSha:$source,deletedReleaseId:$release_id,intentSha256:$intent,runId:$run,runAttempt:$attempt}' >nightly-deletion-receipt.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: inputs.operation == 'replace-unpublished-draft'
        with: {name: nightly-deletion-receipt, path: nightly-deletion-receipt.json, retention-days: 90, if-no-files-found: error}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: inputs.operation == 'replace-unpublished-draft'
        with: {subject-path: nightly-deletion-receipt.json}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: inputs.operation == 'replace-unpublished-draft'
        with: {name: nightly-deletion-receipt, path: retained-receipt}
      - name: Retrieve deletion receipt before recreation
        if: inputs.operation == 'replace-unpublished-draft'
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          cmp nightly-deletion-receipt.json retained-receipt/nightly-deletion-receipt.json
          gh attestation verify retained-receipt/nightly-deletion-receipt.json --repo "${{ github.repository }}"
      - id: draft
        name: Reuse or recreate the draft for the existing immutable tag
        env: {GH_TOKEN: '${{ steps.app-token.outputs.token }}'}
        run: |
          if [ "$OPERATION" = resume-draft ]; then
            id="$RELEASE_INPUT"
          else
            body="$(printf '# Recovered unstable nightly\n\nSource: https://github.com/%s/commit/%s\nVersion: %s\n' "${{ github.repository }}" "$SOURCE_SHA" "${{ needs.plan.outputs.version }}")"
            release="$(gh api --method POST "repos/${{ github.repository }}/releases" -f tag_name="$TAG" -f name="$TAG" -F draft=true -F prerelease=true -f make_latest=false -F generate_release_notes=false -f body="$body")"
            jq -e --arg tag "$TAG" '.tag_name==$tag and .draft==true and .published_at==null and .prerelease==true' <<<"$release" >/dev/null
            id="$(jq -r '.id' <<<"$release")"
          fi
          echo "release_id=$id" >>"$GITHUB_OUTPUT"
      - name: Upload missing assets, verify, publish, and advance branch
        env: {GH_TOKEN: '${{ steps.app-token.outputs.token }}'}
        run: |
          id="${{ steps.draft.outputs.release_id }}"
          release="$(gh api "repos/${{ github.repository }}/releases/$id")"
          jq -e --arg tag "$TAG" --argjson id "$id" '.id==$id and .tag_name==$tag and .draft==true and .published_at==null and .prerelease==true' <<<"$release" >/dev/null
          assets="$(gh api --paginate "repos/${{ github.repository }}/releases/$id/assets" | jq -sc '[.[][] | {id,name,state}]')"
          jq -e 'all(.[];.state=="uploaded") and (length==([.[].name]|unique|length))' <<<"$assets" >/dev/null
          while IFS= read -r asset; do
            name="$(jq -r '.name' <<<"$asset")"; asset_id="$(jq -r '.id' <<<"$asset")"
            [ -f "candidate/$name" ] || { echo "unexpected existing asset: $name" >&2; exit 1; }
            gh api -H 'Accept: application/octet-stream' "repos/${{ github.repository }}/releases/assets/$asset_id" >remote-one
            [ "$(bash scripts/sha256-file.sh remote-one)" = "$(bash scripts/sha256-file.sh "candidate/$name")" ]
          done < <(jq -c '.[]' <<<"$assets")
          for file in candidate/*; do
            name="$(basename "$file")"
            count="$(jq --arg name "$name" '[.[]|select(.name==$name)]|length' <<<"$assets")"
            [ "$count" -eq 1 ] || gh release upload "$TAG" "$file"
          done
          mkdir remote-final
          final_assets="$(gh api --paginate "repos/${{ github.repository }}/releases/$id/assets" | jq -sc 'add // []')"
          while IFS=$'\t' read -r asset_id name state; do [ "$state" = uploaded ]; gh api -H 'Accept: application/octet-stream' "repos/${{ github.repository }}/releases/assets/$asset_id" >"remote-final/$name"; done < <(jq -r '.[]|[.id,.name,.state]|@tsv' <<<"$final_assets")
          NIGHTLY_MANIFEST_SCHEMA_PATH="$PWD/release-source/tools/nightly-manifest.schema.json" bash scripts/check-nightly-assets.sh remote-final remote-final/codex-warp-nightly-manifest.json "$PWD/release-source"
          find candidate -maxdepth 1 -type f -printf '%f\n' | sort >candidate-final-names.txt
          find remote-final -maxdepth 1 -type f -printf '%f\n' | sort >remote-final-names.txt
          cmp candidate-final-names.txt remote-final-names.txt
          while IFS= read -r name; do cmp "candidate/$name" "remote-final/$name"; done <candidate-final-names.txt
          for archive in remote-final/*.tar.xz remote-final/*.zip; do bash scripts/verify-nightly-attestation.sh "$archive" remote-final/codex-warp-nightly-manifest.json; done
          release="$(gh api "repos/${{ github.repository }}/releases/$id")"
          jq -e --arg tag "$TAG" --argjson id "$id" '.id==$id and .tag_name==$tag and .draft==true and .published_at==null and .prerelease==true' <<<"$release" >/dev/null
          [ "$(gh api "repos/${{ github.repository }}/git/ref/tags/$TAG" --jq '.object.sha')" = "$SOURCE_SHA" ]
          gh api --method PATCH "repos/${{ github.repository }}/releases/$id" -F draft=false -F prerelease=true -f make_latest=false >/dev/null
          bash scripts/advance-nightly-branch.sh >/dev/null

  repair-branch:
    needs: plan
    if: needs.plan.outputs.repair == 'true' && vars.NIGHTLY_RECOVERY_READY == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release-automation
    permissions: {attestations: read, contents: read}
    env: {GH_TOKEN: '${{ github.token }}', TAG: '${{ inputs.tag }}', SOURCE_SHA: '${{ inputs.expected_sha }}'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: '${{ github.workflow_sha }}', fetch-depth: 0, persist-credentials: false}
      - name: Materialize frozen nightly source separately from protected control code
        run: |
          git fetch --no-tags origin main
          git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
          [ "$(git rev-parse HEAD)" = "${{ github.workflow_sha }}" ]
          git merge-base --is-ancestor "${{ github.workflow_sha }}" origin/main
          [ "$(git rev-parse "refs/tags/$TAG^{}")" = "$SOURCE_SHA" ]
          git worktree add --quiet --detach release-source "$SOURCE_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: 24.20.0, cache: npm, cache-dependency-path: tools/release-please-policy/package-lock.json}
      - run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
        working-directory: tools/release-please-policy
      - name: Verify complete published release before private key use
        run: |
          temp="$(mktemp -d)"; gh release download "$TAG" --repo "${{ github.repository }}" --dir "$temp"
          NIGHTLY_MANIFEST_SCHEMA_PATH="$PWD/release-source/tools/nightly-manifest.schema.json" bash scripts/check-nightly-assets.sh "$temp" "$temp/codex-warp-nightly-manifest.json" "$PWD/release-source"
          jq -e --arg tag "$TAG" --arg sha "$SOURCE_SHA" '.tag==$tag and .sourceSha==$sha' "$temp/codex-warp-nightly-manifest.json" >/dev/null
          for archive in "$temp"/*.tar.xz "$temp"/*.zip; do bash scripts/verify-nightly-attestation.sh "$archive" "$temp/codex-warp-nightly-manifest.json"; done
          branch="$(git ls-remote origin refs/heads/nightly|awk '{print $1}')"; if [ -n "$branch" ]; then git merge-base --is-ancestor "$branch" "$SOURCE_SHA"; fi
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with: {client-id: '${{ vars.RELEASE_APP_CLIENT_ID }}', private-key: '${{ secrets.RELEASE_APP_PRIVATE_KEY }}', owner: '${{ github.repository_owner }}', repositories: Codex-warp, permission-contents: write, permission-workflows: write}
      - name: Create or fast-forward nightly branch only
        env: {GH_TOKEN: '${{ steps.app-token.outputs.token }}'}
        run: |
          release="$(gh api "repos/${{ github.repository }}/releases/tags/$TAG")"
          jq -e --arg tag "$TAG" '.tag_name==$tag and .draft==false and .published_at!=null and .prerelease==true' <<<"$release" >/dev/null
          [ "$(gh api "repos/${{ github.repository }}/git/ref/tags/$TAG" --jq '.object.sha')" = "$SOURCE_SHA" ]
          bash scripts/advance-nightly-branch.sh >/dev/null
