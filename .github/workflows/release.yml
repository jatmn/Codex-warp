      TAG: ${{ github.ref_name }}
      RELEASE_ID: ${{ needs.prepare-official-release.outputs.release_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
