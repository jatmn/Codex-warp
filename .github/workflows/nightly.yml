name: Nightly

on:
  schedule:
    - cron: '17 3 * * *'
      timezone: America/Los_Angeles
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify without publishing
        required: true
        type: boolean
        default: true
      source_sha:
        description: Full main-reachable SHA for existing-state inspection/recovery only
        required: false
        type: string
        default: ''

concurrency:
  group: nightly-release
  queue: max

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      attestations: read
      contents: read
    outputs:
      publish: ${{ steps.prepare.outputs.publish }}
      action: ${{ steps.prepare.outputs.action }}
      source_sha: ${{ steps.prepare.outputs.source_sha }}
      live_main_sha: ${{ steps.prepare.outputs.live_main_sha }}
      date: ${{ steps.prepare.outputs.date }}
      short_sha: ${{ steps.prepare.outputs.short_sha }}
      base_version: ${{ steps.prepare.outputs.base_version }}
      version: ${{ steps.prepare.outputs.version }}
      tag: ${{ steps.prepare.outputs.tag }}
      branch_sha: ${{ steps.prepare.outputs.branch_sha }}
      branch_state: ${{ steps.prepare.outputs.branch_state }}
      release_id: ${{ steps.prepare.outputs.release_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: tools/release-please-policy/package-lock.json
      - run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
        working-directory: tools/release-please-policy
      - id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_DRY_RUN: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run }}
          NIGHTLY_PUBLISH_ENABLED: ${{ vars.NIGHTLY_PUBLISH_ENABLED || 'false' }}
          NIGHTLY_SOURCE_SHA_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || '' }}
        run: bash scripts/prepare-nightly.sh
      - name: Summary
        run: |
          {
            echo '## Nightly preparation'
            echo '- Action: `${{ steps.prepare.outputs.action }}`'
            echo '- Publish requested: `${{ steps.prepare.outputs.publish }}`'
            echo '- Mutation gate: `${{ vars.NIGHTLY_MUTATION_READY || 'false' }}`'
            echo '- Source: `${{ steps.prepare.outputs.source_sha }}`'
            echo '- Tag: `${{ steps.prepare.outputs.tag }}`'
            echo '- Version: `${{ steps.prepare.outputs.version }}`'
          } >>"$GITHUB_STEP_SUMMARY"

  build:
    needs: prepare
    if: needs.prepare.outputs.action == 'build'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: x86_64-unknown-linux-gnu, runner: ubuntu-24.04, binary: target/x86_64-unknown-linux-gnu/release/codex-warp}
          - {target: aarch64-apple-darwin, runner: macos-15, binary: target/aarch64-apple-darwin/release/codex-warp}
          - {target: x86_64-apple-darwin, runner: macos-15-intel, binary: target/x86_64-apple-darwin/release/codex-warp}
          - {target: x86_64-pc-windows-msvc, runner: windows-2025, binary: target/x86_64-pc-windows-msvc/release/codex-warp.exe}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm pinned source and Rust
        shell: bash
        run: |
          [ "$(git rev-parse HEAD)" = "${{ needs.prepare.outputs.source_sha }}" ]
          rustup target add "${{ matrix.target }}"
          rustc -Vv
          cargo -Vv
      - name: Linux locked tests
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        env:
          CODEX_WARP_BUILD_VERSION: ${{ needs.prepare.outputs.version }}
        run: cargo test --locked
      - name: Build source-exact nightly
        shell: bash
        env:
          CODEX_WARP_BUILD_VERSION: ${{ needs.prepare.outputs.version }}
        run: cargo build --release --locked --target "${{ matrix.target }}"
      - name: Package and smoke test
        shell: bash
        env:
          NIGHTLY_DATE: ${{ needs.prepare.outputs.date }}
          NIGHTLY_SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          NIGHTLY_VERSION: ${{ needs.prepare.outputs.version }}
          NIGHTLY_TAG: ${{ needs.prepare.outputs.tag }}
          TARGET: ${{ matrix.target }}
          BINARY_PATH: ${{ matrix.binary }}
          OUTPUT_DIR: target/nightly
          RUNNER_LABEL: ${{ matrix.runner }}
          WORKFLOW_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          export RUNNER_IMAGE="${ImageOS:-${{ runner.os }}}/${ImageVersion:-unknown}"
          bash scripts/package-nightly.sh
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: target/nightly/codex-warp-${{ needs.prepare.outputs.tag }}-${{ matrix.target }}.*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-${{ matrix.target }}
          path: target/nightly/
          if-no-files-found: error

  collect:
    needs: [prepare, build]
    if: needs.prepare.outputs.action == 'build' && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: tools/release-please-policy/package-lock.json
      - run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
        working-directory: tools/release-please-policy
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: nightly-*
          path: nightly-assets
          merge-multiple: true
      - name: Merge evidence and validate candidate
        shell: bash
        run: |
          mapfile -t evidence < <(find nightly-assets -maxdepth 1 -name '*-nightly-evidence.json' -print | sort)
          [ "${#evidence[@]}" -eq 4 ]
          jq -s '
            .[0] as $first |
            if all(.[]; .repository == $first.repository and .tag == $first.tag and .date == $first.date and .sourceSha == $first.sourceSha and .baseVersion == $first.baseVersion and .version == $first.version and .workflow == $first.workflow and .workflowSha == $first.workflowSha and .cargoLockSha256 == $first.cargoLockSha256 and .rustToolchainSha256 == $first.rustToolchainSha256 and .packagingContractSha256 == $first.packagingContractSha256 and .packagingScriptSha256 == $first.packagingScriptSha256) then
              {"$schema":"./nightly-manifest.schema.json",schemaVersion:1,fileName:"codex-warp-nightly-manifest.json",repository:$first.repository,tag:$first.tag,date:$first.date,sourceSha:$first.sourceSha,baseVersion:$first.baseVersion,version:$first.version,workflow:$first.workflow,workflowSha:$first.workflowSha,cargoLockSha256:$first.cargoLockSha256,rustToolchainSha256:$first.rustToolchainSha256,packagingContractSha256:$first.packagingContractSha256,packagingScriptSha256:$first.packagingScriptSha256,artifacts:(map(.artifact)|sort_by(.target))}
            else error("nightly target evidence disagrees") end
          ' "${evidence[@]}" >nightly-assets/codex-warp-nightly-manifest.json
          jq -r '.artifacts[] | [.archiveSha256,.archive] | @tsv' nightly-assets/codex-warp-nightly-manifest.json | sed $'s/\t/  /' >nightly-assets/sha256.sum
          rm "${evidence[@]}"
          SOURCE_DIR="$PWD" bash scripts/check-nightly-assets.sh nightly-assets nightly-assets/codex-warp-nightly-manifest.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-release-candidate
          path: nightly-assets/
          if-no-files-found: error

  retain-intent:
    needs: [prepare, collect]
    if: needs.prepare.outputs.publish == 'true' && needs.prepare.outputs.action == 'build' && needs.collect.result == 'success' && vars.NIGHTLY_MUTATION_READY == 'true'
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: read
      id-token: write
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nightly-release-candidate
          path: nightly-assets
      - name: Record pre-mutation intent
        shell: bash
        run: |
          remote_tag="$(git ls-remote --tags --refs origin "refs/tags/${{ needs.prepare.outputs.tag }}")" || { echo 'unable to inspect candidate nightly tag' >&2; exit 1; }
          [ -z "$remote_tag" ]
          release_count="$(gh api --paginate "repos/${{ github.repository }}/releases?per_page=100" | jq -s --arg tag "${{ needs.prepare.outputs.tag }}" '[.[][] | select(.tag_name==$tag)] | length')"
          [ "$release_count" -eq 0 ]
          branch="$(git ls-remote origin refs/heads/nightly | awk '{print $1}')"
          jq -n \
            --arg repository "${{ github.repository }}" --arg tag "${{ needs.prepare.outputs.tag }}" \
            --arg source "${{ needs.prepare.outputs.source_sha }}" --arg branch "$branch" \
            --arg workflow_sha "${{ github.workflow_sha }}" \
            --argjson run_id "${{ github.run_id }}" --argjson attempt "${{ github.run_attempt }}" \
            --arg manifest "$(sha256sum nightly-assets/codex-warp-nightly-manifest.json | awk '{print $1}')" \
            --argjson inventory "$(find nightly-assets -maxdepth 1 -type f -printf '%f\n' | sort | jq -Rsc 'split("\n")[:-1]')" \
            '{schemaVersion:1,operation:"fresh-nightly",repository:$repository,tag:$tag,sourceSha:$source,priorBranchSha:(if ($branch|length)>0 then $branch else null end),tagAbsent:true,releaseAbsent:true,workflowSha:$workflow_sha,runId:$run_id,runAttempt:$attempt,manifestSha256:$manifest,inventory:$inventory}' >nightly-intent.json
      - id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-publication-intent
          path: nightly-intent.json
          retention-days: 90
          if-no-files-found: error
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: nightly-intent.json

  publish:
    needs: [prepare, collect, retain-intent]
    if: needs.prepare.outputs.publish == 'true' && needs.prepare.outputs.action == 'build' && needs.collect.result == 'success' && needs.retain-intent.result == 'success' && vars.NIGHTLY_MUTATION_READY == 'true'
    runs-on: ubuntu-24.04
    environment: release-automation
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: tools/release-please-policy/package-lock.json
      - run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
        working-directory: tools/release-please-policy
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: nightly-release-candidate, path: nightly-assets}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: nightly-publication-intent}
      - name: Final read-only state validation
        shell: bash
        run: |
          SOURCE_DIR="$PWD" bash scripts/check-nightly-assets.sh nightly-assets nightly-assets/codex-warp-nightly-manifest.json
          while IFS= read -r archive; do
            gh attestation verify "nightly-assets/$archive" --repo "${{ github.repository }}"
          done < <(jq -r '.artifacts[].archive' nightly-assets/codex-warp-nightly-manifest.json)
          [ "$(gh api "repos/${{ github.repository }}/git/ref/heads/main" --jq '.object.sha')" = "$SOURCE_SHA" ]
          remote_tag="$(git ls-remote --tags --refs origin "refs/tags/$TAG")" || { echo 'unable to inspect candidate nightly tag' >&2; exit 1; }
          [ -z "$remote_tag" ]
          release_count="$(gh api --paginate "repos/${{ github.repository }}/releases?per_page=100" | jq -s --arg tag "$TAG" '[.[][] | select(.tag_name==$tag)] | length')"
          [ "$release_count" -eq 0 ]
          branch="$(git ls-remote origin refs/heads/nightly | awk '{print $1}')"
          if [ -n "$branch" ]; then git merge-base --is-ancestor "$branch" "$SOURCE_SHA"; fi
          gh attestation verify nightly-intent.json --repo "${{ github.repository }}"
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: Codex-warp
          permission-contents: write
          permission-workflows: write
      - name: Create immutable nightly tag and receipt
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if tag_lookup="$(gh api --include "repos/${{ github.repository }}/git/ref/tags/$TAG" 2>&1)"; then
            echo "nightly tag appeared before creation: $TAG" >&2
            exit 1
          fi
          grep -Eq '^HTTP/[0-9.]+ 404([[:space:]]|$)' <<<"$tag_lookup" || { echo 'unable to prove nightly tag absence with the mutation token' >&2; printf '%s\n' "$tag_lookup" >&2; exit 1; }
          response="$(gh api --method POST "repos/${{ github.repository }}/git/refs" -f ref="refs/tags/$TAG" -f sha="$SOURCE_SHA")"
          [ "$(jq -r '.object.sha' <<<"$response")" = "$SOURCE_SHA" ]
          [ "$(gh api "repos/${{ github.repository }}/git/ref/tags/$TAG" --jq '.object.sha')" = "$SOURCE_SHA" ]
          jq -n --arg tag "$TAG" --arg sha "$SOURCE_SHA" --arg intent "$(sha256sum nightly-intent.json | awk '{print $1}')" --arg workflow "${{ github.workflow_sha }}" --argjson run "${{ github.run_id }}" --argjson attempt "${{ github.run_attempt }}" '{schemaVersion:1,tag:$tag,peeledSha:$sha,intentSha256:$intent,workflowSha:$workflow,runId:$run,runAttempt:$attempt,apiStatus:201}' >nightly-tag-receipt.json
      - id: receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: {name: nightly-tag-creation-receipt, path: nightly-tag-receipt.json, retention-days: 90, if-no-files-found: error}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with: {subject-path: nightly-tag-receipt.json}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: nightly-tag-creation-receipt, path: retained-tag-receipt}
      - id: draft
        name: Create draft prerelease for existing tag
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          cmp nightly-tag-receipt.json retained-tag-receipt/nightly-tag-receipt.json
          gh attestation verify retained-tag-receipt/nightly-tag-receipt.json --repo "${{ github.repository }}"
          releases="$(gh api --paginate "repos/${{ github.repository }}/releases?per_page=100" | jq -sc 'add // []')"
          [ "$(jq --arg tag "$TAG" '[.[] | select(.tag_name==$tag)] | length' <<<"$releases")" -eq 0 ] || {
            echo "nightly release appeared before draft creation: $TAG" >&2
            exit 1
          }
          body="$(printf '# Unstable nightly build\n\nThis build is for testing. Source: https://github.com/%s/commit/%s\nVersion: %s\nWorkflow: https://github.com/%s/actions/runs/%s\n\nArchives include runtime configuration. Verify sha256.sum and GitHub attestations. Stable release: https://github.com/%s/releases/latest\n' "${{ github.repository }}" "$SOURCE_SHA" "${{ needs.prepare.outputs.version }}" "${{ github.repository }}" "${{ github.run_id }}" "${{ github.repository }}")"
          release="$(gh api --method POST "repos/${{ github.repository }}/releases" -f tag_name="$TAG" -f name="$TAG" -F draft=true -F prerelease=true -f make_latest=false -F generate_release_notes=false -f body="$body")"
          jq -e --arg tag "$TAG" '.tag_name == $tag and .draft == true and .prerelease == true' <<<"$release" >/dev/null
          echo "release_id=$(jq -r '.id' <<<"$release")" >>"$GITHUB_OUTPUT"
      - name: Upload complete candidate
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh release upload "$TAG" nightly-assets/*
      - name: Verify and publish exact prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
        run: |
          mkdir remote
          assets="$(gh api --paginate "repos/${{ github.repository }}/releases/$RELEASE_ID/assets" | jq -sc 'add // []')"
          jq -r '.[].name' <<<"$assets" | sort >remote-names.txt
          find nightly-assets -maxdepth 1 -type f -printf '%f\n' | sort >expected-names.txt
          cmp expected-names.txt remote-names.txt
          while IFS=$'\t' read -r id name state; do
            [ "$state" = uploaded ]
            gh api -H 'Accept: application/octet-stream' "repos/${{ github.repository }}/releases/assets/$id" >"remote/$name"
            [ "$(sha256sum "remote/$name" | awk '{print $1}')" = "$(sha256sum "nightly-assets/$name" | awk '{print $1}')" ]
          done < <(jq -r '.[] | [.id,.name,.state] | @tsv' <<<"$assets")
          SOURCE_DIR="$PWD" bash scripts/check-nightly-assets.sh remote remote/codex-warp-nightly-manifest.json
          for archive in remote/*.tar.xz remote/*.zip; do gh attestation verify "$archive" --repo "${{ github.repository }}"; done
          [ "$(gh api "repos/${{ github.repository }}/git/ref/tags/$TAG" --jq '.object.sha')" = "$SOURCE_SHA" ]
          release="$(gh api "repos/${{ github.repository }}/releases/$RELEASE_ID")"
          jq -e --arg tag "$TAG" --argjson id "$RELEASE_ID" '.id==$id and .tag_name==$tag and .draft==true and .published_at==null and .prerelease==true' <<<"$release" >/dev/null
          gh api --method PATCH "repos/${{ github.repository }}/releases/$RELEASE_ID" -F draft=false -F prerelease=true -f make_latest=false >/dev/null
      - name: Create or fast-forward nightly branch
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          branch_action="$(bash scripts/advance-nightly-branch.sh)"
          {
            echo "Published [$TAG](https://github.com/${{ github.repository }}/releases/tag/$TAG)."
            echo "Intent artifact: ${{ needs.retain-intent.outputs.artifact_id }}"
            echo "Tag receipt artifact: ${{ steps.receipt.outputs.artifact-id }}"
            echo "Nightly branch: $branch_action at $SOURCE_SHA"
          } >>"$GITHUB_STEP_SUMMARY"

  repair-branch:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true' && needs.prepare.outputs.action == 'branch-repair' && vars.NIGHTLY_MUTATION_READY == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release-automation
    permissions:
      attestations: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Materialize frozen nightly source separately from protected control code
        run: |
          git fetch --no-tags origin main
          git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
          [ "$(git rev-parse HEAD)" = "${{ github.workflow_sha }}" ]
          git merge-base --is-ancestor "${{ github.workflow_sha }}" origin/main
          [ "$(git rev-parse "refs/tags/$TAG^{}")" = "$SOURCE_SHA" ]
          git worktree add --quiet --detach release-source "$SOURCE_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: tools/release-please-policy/package-lock.json
      - run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
        working-directory: tools/release-please-policy
      - name: Revalidate the published nightly before private key use
        shell: bash
        run: |
          [ "$(git rev-parse "refs/tags/$TAG^{}")" = "$SOURCE_SHA" ]
          release="$(gh api "repos/${{ github.repository }}/releases/$RELEASE_ID")"
          jq -e --arg tag "$TAG" --argjson id "$RELEASE_ID" '.id == $id and .tag_name == $tag and .draft == false and .prerelease == true and .published_at != null' <<<"$release" >/dev/null
          temp="$(mktemp -d)"
          gh release download "$TAG" --repo "${{ github.repository }}" --dir "$temp"
          NIGHTLY_MANIFEST_SCHEMA_PATH="$PWD/release-source/tools/nightly-manifest.schema.json" bash scripts/check-nightly-assets.sh "$temp" "$temp/codex-warp-nightly-manifest.json" "$PWD/release-source"
          jq -e --arg tag "$TAG" --arg sha "$SOURCE_SHA" '.tag == $tag and .sourceSha == $sha' "$temp/codex-warp-nightly-manifest.json" >/dev/null
          while IFS= read -r archive; do
            gh attestation verify "$temp/$archive" --repo "${{ github.repository }}"
          done < <(jq -r '.artifacts[].archive' "$temp/codex-warp-nightly-manifest.json")
          branch="$(git ls-remote origin refs/heads/nightly | awk '{print $1}')"
          if [ -n "$branch" ]; then git merge-base --is-ancestor "$branch" "$SOURCE_SHA"; fi
          rm -rf "$temp"
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: Codex-warp
          permission-contents: write
          permission-workflows: write
      - name: Create or fast-forward nightly branch only
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          release="$(gh api "repos/${{ github.repository }}/releases/$RELEASE_ID")"
          jq -e --arg tag "$TAG" --argjson id "$RELEASE_ID" '.id==$id and .tag_name==$tag and .draft==false and .published_at!=null and .prerelease==true' <<<"$release" >/dev/null
          [ "$(gh api "repos/${{ github.repository }}/git/ref/tags/$TAG" --jq '.object.sha')" = "$SOURCE_SHA" ]
          bash scripts/advance-nightly-branch.sh >/dev/null
          echo "Repaired \`nightly\` at the verified published release [$TAG](https://github.com/${{ github.repository }}/releases/tag/$TAG)." >>"$GITHUB_STEP_SUMMARY"
