name: Mutants

on:
  pull_request:

concurrency:
  group: mutants-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  incremental:
    name: Incremental (PR diff)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Diff against base
        id: rust-diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags origin "$BASE_SHA"
          git diff "$BASE_SHA...HEAD" -- "*.rs" | tee git.diff
          if [ -s git.diff ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "No Rust diff; skipping mutants"
          fi

      - name: Install Rust
        if: steps.rust-diff.outputs.needed == 'true'
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable as of 2026-06-30

      - name: Cache Cargo
        if: steps.rust-diff.outputs.needed == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: false

      - name: Install cargo-mutants
        if: steps.rust-diff.outputs.needed == 'true'
        uses: taiki-e/install-action@fcf5432d9f50d67e37ee6e29bdb7a224ff67b4a7 # v2.86.8
        with:
          tool: cargo-mutants

      - name: Mutate changed code
        if: steps.rust-diff.outputs.needed == 'true'
        run: cargo mutants --no-shuffle -vV --in-diff git.diff -- --locked

      - name: Upload mutants.out
        if: ${{ !cancelled() && steps.rust-diff.outputs.needed == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutants-incremental.out
          path: mutants.out
          if-no-files-found: ignore
