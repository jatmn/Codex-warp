name: Mutants

on:
  pull_request:

concurrency:
  group: mutants-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  incremental:
    name: Incremental (PR diff)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Diff the pull request merge
        id: rust-diff
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          actual_head="$(git rev-parse --verify 'HEAD^2')"
          if [ "$actual_head" != "$PR_HEAD_SHA" ]; then
            echo "The checked-out merge commit does not contain the expected pull request head" >&2
            exit 1
          fi
          # The base may have advanced between the event and the checkout.
          git diff HEAD^1 HEAD -- "*.rs" | tee git.diff
          if [ -s git.diff ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "No Rust diff; skipping mutants"
          fi

      - name: Install Rust
        if: steps.rust-diff.outputs.needed == 'true'
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable as of 2026-06-30

      - name: Cache Cargo
        if: steps.rust-diff.outputs.needed == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false

      - name: Install cargo-mutants
        if: steps.rust-diff.outputs.needed == 'true'
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-mutants

      - name: Mutate changed code
        if: steps.rust-diff.outputs.needed == 'true'
        run: cargo mutants --no-shuffle -vV --in-diff git.diff -- --locked

      - name: Upload mutants.out
        if: ${{ !cancelled() && steps.rust-diff.outputs.needed == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-incremental.out
          path: mutants.out
          if-no-files-found: ignore
