[package]
name = "codex-warp"
version = "0.0.1"
edition = "2024"
description = "A local Responses API compatibility proxy for Codex clients"
repository = "https://github.com/jatmn/Codex-warp"
readme = "README.md"
license-file = "LICENSE"

[dependencies]
anyhow = "1"
async-stream = "0.3"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
bytes = "1"
clap = { version = "4", default-features = false, features = ["derive", "error-context", "help", "std", "usage"] }
futures-util = "0.3"
libc = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "registry", "std"] }

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.dist]
inherits = "release"
lto = "thin"
